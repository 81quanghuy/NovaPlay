# ===================================================================
# EXTENSION FIELDS (x-) FOR REUSABLE BLOCKS (DRY PRINCIPLE)
# ===================================================================
x-microservice-base: &microservice-base
  # Base configuration inherited by all custom microservices.
  # Không đặt healthcheck ở đây: docker-compose thay biến ${PORT:-8080} tại thời điểm PARSE
  # file (phía host), không phải bên trong container, nên nó luôn ra 8080 bất kể mỗi service
  # thật sự lắng nghe cổng nào. Mỗi Dockerfile đã tự khai báo HEALTHCHECK đúng cổng của nó,
  # và `depends_on: condition: service_healthy` vẫn hoạt động dựa trên healthcheck của image.
  extends:
    file: common-config.yml
    service: microservice-base-config
  networks: [novaPLay]

x-loki-common: &loki-common
  # Common configuration for all Loki components.
  image: grafana/loki:${LOKI_VERSION:-3.1.2}
  volumes:
    # Mount the Loki configuration file.
    - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
  networks:
    - novaPLay
  healthcheck:
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
  depends_on:
    - minio

services:
  # ===================================================================
  # CORE INFRASTRUCTURE
  # ===================================================================
  postgres:
    image: postgres:${POSTGRES_VERSION:-latest}
    container_name: postgres-server
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Không có biến này, Postgres tạo database mặc định trùng tên user ("admin") thay vì
      # "auth_service" mà auth-service thực sự kết nối tới.
      POSTGRES_DB_FILE: /run/secrets/db_name
    secrets: [db_user, db_password, db_name]
    ports: ["5432:5432"]
    volumes: ["../init-db:/docker-entrypoint-initdb.d"]
    networks: [novaPLay]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user)"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: redis-service
    ports: ["6379:6379"]
    networks: [novaPLay]
    restart: always

  # Chạy dưới dạng replica set một node: MongoDB chỉ hỗ trợ transaction trên replica set,
  # còn mongod standalone khiến mọi @Transactional trở thành no-op im lặng.
  mongodb:
    image: mongo:${MONGO_VERSION:-7}
    container_name: mongodb-service
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongodb_data:/data/db"]
    networks: [novaPLay]
    healthcheck:
      # Tự khởi tạo replica set trong lần chạy đầu; các lần sau lệnh này là no-op.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-services:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: kafka-services
    ports: ["9092:9092"]
    volumes: ["kafka_services_data:/tmp/kraft-combined-logs"]
    networks: [novaPLay]
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9095
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-services:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-services:9095
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [kafka-services]
    networks: [novaPLay]           # phải cùng network với kafka-services
    ports:
      - "8080:8080"                # mở UI ra host
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-services:29092
      # (tuỳ chọn) bật login cho UI
      - AUTH_TYPE=LOGIN_FORM
      - SPRING_SECURITY_USER_NAME=admin
      - SPRING_SECURITY_USER_PASSWORD=admin

  # Máy chủ SMTP giả cho môi trường QA: nhận mọi email và hiển thị ở web UI thay vì gửi thật.
  # Không có nó thì notification-service không khởi động nổi kênh email, và tệ hơn là một cấu
  # hình sai có thể khiến email test bay tới hộp thư người dùng thật.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    networks: [novaPLay]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ===================================================================
  # OBSERVABILITY STACK (Loki, Prometheus, Grafana, etc.)
  # ===================================================================
  loki-write:
    <<: *loki-common
    container_name: loki-write
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports: ["3102:3100"]

  loki-read:
    <<: *loki-common
    container_name: loki-read
    command: "-config.file=/etc/loki/config.yaml -target=read"
    ports: ["3101:3100"]

  loki-backend:
    <<: *loki-common
    container_name: loki-backend
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"

  loki-gateway:
    image: nginx:${NGINX_VERSION:-1.27.3}
    container_name: loki-gateway
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["3100:3100"]
    networks: [novaPLay]
    depends_on: [loki-read, loki-write]

  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-12-18T13-15-44Z}
    container_name: minio-storage
    entrypoint: ["sh", "-euc", "mkdir -p /data/loki-data && minio server /data"]
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
    ports: ["9001:9000"]
    volumes: ["./.data/minio:/data"]
    networks: [novaPLay]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 20s
      retries: 5

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.1.0}
    container_name: prometheus-monitoring
    ports: ["9090:9090"]
    volumes: ["../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [novaPLay]

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.6.1}
    container_name: tempo-tracing
    command: -config.file /etc/tempo-config.yml
    ports: ["3110:3100", "4318:4318"]
    volumes: ["../observability/tempo/tempo.yml:/etc/tempo-config.yml:ro"]
    networks: [novaPLay]

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.5.1}
    container_name: alloy-collector
    volumes:
      - ../observability/alloy/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports: ["12345:12345"]
    networks: [novaPLay]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    container_name: grafana-dashboard
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports: ["3000:3000"]
    volumes: ["../observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro"]
    networks: [novaPLay]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # APPLICATION SERVICES
  # ===================================================================
  auth-service:
    image: "novaplay/authservice:${AUTH_SERVICE_VERSION:-v0.0.1}"
    container_name: auth-service
    <<: *microservice-base
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "auth-service"
      OTEL_SERVICE_NAME: "auth-service"
      # application-dev.yml hardcode "localhost" cho Postgres/Redis — bên trong container đó
      # là chính nó, không phải service postgres/redis. Username/password khớp nội dung
      # docker-compose/secrets/db_user.txt và db_password.txt.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/auth_service"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "admin123"
      SPRING_DATA_REDIS_HOST: redis

  user-service:
    image: "novaplay/userservice:${USER_SERVICE_VERSION:-v0.0.1}"
    container_name: user-service
    <<: *microservice-base
    ports: ["8700:8700"]
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      OTEL_SERVICE_NAME: "user-service"
      # user-service dùng MongoDB, không phải PostgreSQL — cấu hình cũ ở đây là tàn dư
      # từ thời trước khi chuyển sang Mongo.
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/user_service?replicaSet=rs0"
      SPRING_DATA_REDIS_HOST: redis

  movie-service:
    image: "novaplay/movie-service:${MOVIE_SERVICE_VERSION:-v0.0.1}"
    container_name: movie-service
    <<: *microservice-base
    ports: ["8600:8600"]
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "movie-service"
      OTEL_SERVICE_NAME: "movie-service"
      # Database riêng, không dùng chung với user_service. movie-service không dùng
      # transaction nên replicaSet ở đây chỉ để khớp với cụm đang chạy sẵn.
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/movie_service?replicaSet=rs0"
      SPRING_DATA_REDIS_HOST: redis

  notification-service:
    image: "novaplay/notification-service:${NOTIFICATION_SERVICE_VERSION:-v0.0.1}"
    container_name: notification-service
    <<: *microservice-base
    ports: ["8900:8900"]
    depends_on:
      mongodb: { condition: service_healthy }
      kafka-services: { condition: service_healthy }
      mailhog: { condition: service_started }
    environment:
      SPRING_APPLICATION_NAME: "notification-service"
      OTEL_SERVICE_NAME: "notification-service"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/notification_service?replicaSet=rs0"
      SPRING_DATA_REDIS_HOST: redis
      # application-dev.yml trỏ SMTP tới localhost:1025; bên trong container đó là chính nó,
      # không phải dịch vụ mailhog. Email gửi ra xem được ở http://localhost:8025.
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
      APPLICATION_FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:3000}"

  api-gateway:
    image: "novaplay/apigateway:${API_GATEWAY_VERSION:-v1.0.0}"
    container_name: api-gateway
    <<: *microservice-base
    ports: ["8072:8072"]
    depends_on:
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "api-gateway"
      OTEL_SERVICE_NAME: "api-gateway"
      SPRING_DATA_REDIS_HOST: redis
      # Container chạy profile "dev" (localhost mặc định trong yml), nhưng bên trong network
      # của compose, mỗi service khác là một container riêng có tên chính là service key —
      # ghi đè 4 biến này để gateway gọi đúng hostname thay vì localhost.
      AUTH_SERVICE_URI: "http://auth-service:8000"
      USER_SERVICE_URI: "http://user-service:8700"
      MOVIE_SERVICE_URI: "http://movie-service:8600"
      NOTIFICATION_SERVICE_URI: "http://notification-service:8900"

# ===================================================================
# TOP-LEVEL DEFINITIONS
# ===================================================================
networks:
  novaPLay:
    driver: bridge

volumes:
  kafka_services_data:
    driver: local
  mongodb_data:
    driver: local

secrets:
  db_user:
    file: ../secrets/db_user.txt
  db_password:
    file: ../secrets/db_password.txt
  db_name:
    file: ../secrets/db_name.txt
