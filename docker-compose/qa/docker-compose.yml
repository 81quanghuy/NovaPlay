# ===================================================================
# EXTENSION FIELDS (x-) FOR REUSABLE BLOCKS (DRY PRINCIPLE)
# ===================================================================
x-microservice-base: &microservice-base
  # Base configuration inherited by all custom microservices.
  # Không đặt healthcheck ở đây: docker-compose thay biến ${PORT:-8080} tại thời điểm PARSE
  # file (phía host), không phải bên trong container, nên nó luôn ra 8080 bất kể mỗi service
  # thật sự lắng nghe cổng nào. Mỗi Dockerfile đã tự khai báo HEALTHCHECK đúng cổng của nó,
  # và `depends_on: condition: service_healthy` vẫn hoạt động dựa trên healthcheck của image.
  extends:
    file: common-config.yml
    service: microservice-base-config
  networks: [novaPLay]

x-loki-common: &loki-common
  # Common configuration for all Loki components.
  image: grafana/loki:${LOKI_VERSION:-3.1.2}
  volumes:
    # Mount the Loki configuration file.
    - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
  networks:
    - novaPLay
  healthcheck:
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
  depends_on:
    - minio

services:
  # ===================================================================
  # CORE INFRASTRUCTURE
  # ===================================================================
  postgres:
    image: postgres:${POSTGRES_VERSION:-latest}
    container_name: postgres-server
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Không có biến này, Postgres tạo database mặc định trùng tên user ("admin") thay vì
      # "auth_service" mà auth-service thực sự kết nối tới.
      POSTGRES_DB_FILE: /run/secrets/db_name
    secrets: [db_user, db_password, db_name]
    ports: ["5432:5432"]
    volumes: ["../init-db:/docker-entrypoint-initdb.d"]
    networks: [novaPLay]
    healthcheck:
      # Phải truyền cả -d: thiếu nó, pg_isready mặc định lấy tên DB trùng tên user ("admin"),
      # database đó không tồn tại nên server ghi FATAL mỗi lần healthcheck chạy — mà lệnh vẫn
      # exit 0, khiến container báo healthy trong khi log đầy lỗi giả.
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: redis-service
    ports: ["6379:6379"]
    networks: [novaPLay]
    restart: always

  # Chạy dưới dạng replica set một node: MongoDB chỉ hỗ trợ transaction trên replica set,
  # còn mongod standalone khiến mọi @Transactional trở thành no-op im lặng.
  mongodb:
    image: mongo:${MONGO_VERSION:-7}
    container_name: mongodb-service
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok } catch(e) {
            rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb-service:27017'}]}).ok
          }
        " | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novaPLay

  mongo-express:
    image: mongo-express:latest
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "9999:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb-service:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    networks:
      - novaPLay

  kafka-services:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: kafka-services
    ports: ["9092:9092"]
    volumes: ["kafka_services_data:/tmp/kraft-combined-logs"]
    networks: [novaPLay]
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9095
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-services:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-services:9095
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-novaplay
    depends_on: [kafka-services]
    networks: [novaPLay]           # phải cùng network với kafka-services
    ports:
      - "8080:8080"                # mở UI ra host
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-services:29092
      # (tuỳ chọn) bật login cho UI
      - AUTH_TYPE=LOGIN_FORM
      - SPRING_SECURITY_USER_NAME=admin
      - SPRING_SECURITY_USER_PASSWORD=admin

  # ===================================================================
  # OBSERVABILITY STACK (Loki, Prometheus, Grafana, etc.)
  # ===================================================================
  loki-write:
    <<: *loki-common
    container_name: loki-write
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports: ["3102:3100"]

  loki-read:
    <<: *loki-common
    container_name: loki-read
    command: "-config.file=/etc/loki/config.yaml -target=read"
    ports: ["3101:3100"]

  loki-backend:
    <<: *loki-common
    container_name: loki-backend
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"

  loki-gateway:
    image: nginx:${NGINX_VERSION:-1.27.3}
    container_name: loki-gateway
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["3100:3100"]
    networks: [novaPLay]
    depends_on: [loki-read, loki-write]

  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-12-18T13-15-44Z}
    container_name: minio-storage
    entrypoint: ["sh", "-euc", "mkdir -p /data/loki-data && minio server /data"]
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
    ports: ["9001:9000"]
    volumes: ["./.data/minio:/data"]
    networks: [novaPLay]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 20s
      retries: 5

  # Instance MinIO riêng cho media-service (giả lập S3 ở dev/QA) — KHÔNG dùng chung với `minio`
  # ở trên, vốn là kho lưu trữ chunk của Loki.
  media-minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-12-18T13-15-44Z}
    container_name: minio-media
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=media-dev
      - MINIO_ROOT_PASSWORD=media-dev-secret
    ports: ["9010:9000", "9011:9001"]
    networks: [novaPLay]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 20s
      retries: 5

  # Tạo sẵn bucket novaplay-media-dev rồi thoát — media-service không tự tạo bucket lúc khởi động.
  media-minio-init:
    image: minio/mc:latest
    container_name: minio-media-init
    depends_on:
      media-minio: { condition: service_healthy }
    entrypoint: ["sh", "-c", "mc alias set local http://media-minio:9000 media-dev media-dev-secret && mc mb -p local/novaplay-media-dev && exit 0"]
    networks: [novaPLay]

  # Nguồn cờ OpenFeature cho media-service (media-storage-provider: aws-s3/cloudflare-r2/
  # backblaze-b2), đọc từ MongoDB (xem config_service.config_flags). Ops đổi backend đang active
  # bằng cách sửa document trực tiếp qua mongo-express (http://localhost:9999) hoặc mongosh —
  # media-service không cần restart, xem ConfigServiceFeatureProvider.
  config-service:
    image: "novaplay/config-service:${CONFIG_SERVICE_VERSION:-v0.0.1}"
    container_name: config-service
    <<: *microservice-base
    ports: ["8500:8500"]
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "config-service"
      OTEL_SERVICE_NAME: "config-service"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/config_service?replicaSet=rs0"

  # Seed giá trị mặc định cho môi trường QA mới dựng — KHÔNG bắt buộc cho tính đúng đắn: nếu key
  # chưa tồn tại, ConfigServiceFeatureProvider tự fallback về feature-flags.default-storage-provider
  # (aws-s3) phía media-service, chỉ để trải nghiệm dev mượt hơn (khỏi phải tự tạo document).
  config-service-init:
    image: mongo:7
    container_name: config-service-init
    depends_on:
      mongodb: { condition: service_healthy }
    entrypoint:
      - mongosh
      - "mongodb://mongodb:27017/config_service?replicaSet=rs0"
      - --eval
      - >-
        db.config_flags.updateOne(
          { _id: "media-storage-provider" },
          { $setOnInsert: { value: "aws-s3" } },
          { upsert: true }
        )
    networks: [novaPLay]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.1.0}
    container_name: prometheus-monitoring
    ports: ["9090:9090"]
    volumes: ["../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [novaPLay]

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.6.1}
    container_name: tempo-tracing
    command: -config.file /etc/tempo-config.yml
    ports: ["3110:3100", "4318:4318"]
    volumes: ["../observability/tempo/tempo.yml:/etc/tempo-config.yml:ro"]
    networks: [novaPLay]

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.5.1}
    container_name: alloy-collector
    volumes:
      - ../observability/alloy/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports: ["12345:12345"]
    networks: [novaPLay]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    container_name: grafana-dashboard
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports: ["3000:3000"]
    volumes: ["../observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro"]
    networks: [novaPLay]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # APPLICATION SERVICES
  # ===================================================================
  auth-service:
    build:
      context: ../../auth-service
      dockerfile: Dockerfile
    image: "novaplay/authservice:${AUTH_SERVICE_VERSION:-v0.0.1}"
    container_name: auth-service
    <<: *microservice-base
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    secrets:
      - jwt_private_key
      - jwt_public_key
    environment:
      SPRING_APPLICATION_NAME: "auth-service"
      OTEL_SERVICE_NAME: "auth-service"
      JAVA_TOOL_OPTIONS: "-javaagent:/app/libs/opentelemetry-javaagent.jar"
      PRIVATE_KEY_PATH: "file:/run/secrets/jwt_private_key"
      PUBLIC_KEY_PATH: "file:/run/secrets/jwt_public_key"
      # application-dev.yml hardcode "localhost" cho Postgres/Redis — bên trong container đó
      # là chính nó, không phải service postgres/redis. Username/password khớp nội dung
      # docker-compose/secrets/db_user.txt và db_password.txt.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/auth_service"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "admin123"
      SPRING_DATA_REDIS_HOST: redis

  user-service:
    image: "novaplay/userservice:${USER_SERVICE_VERSION:-v0.0.1}"
    container_name: user-service
    <<: *microservice-base
    ports: ["8700:8700"]
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      OTEL_SERVICE_NAME: "user-service"
      # user-service dùng MongoDB, không phải PostgreSQL — cấu hình cũ ở đây là tàn dư
      # từ thời trước khi chuyển sang Mongo.
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/user_service?replicaSet=rs0"
      SPRING_DATA_REDIS_HOST: redis

  movie-service:
    image: "novaplay/movie-service:${MOVIE_SERVICE_VERSION:-v0.0.1}"
    container_name: movie-service
    <<: *microservice-base
    ports: ["8600:8600"]
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "movie-service"
      OTEL_SERVICE_NAME: "movie-service"
      # Database riêng, không dùng chung với user_service. movie-service không dùng
      # transaction nên replicaSet ở đây chỉ để khớp với cụm đang chạy sẵn.
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/movie_service?replicaSet=rs0"
      SPRING_DATA_REDIS_HOST: redis

  media-service:
    image: "novaplay/media-service:${MEDIA_SERVICE_VERSION:-v0.0.1}"
    container_name: media-service
    <<: *microservice-base
    ports: ["8081:8081"]
    depends_on:
      mongodb: { condition: service_healthy }
      kafka-services: { condition: service_healthy }
      media-minio-init: { condition: service_completed_successfully }
      # "service_started" (không phải "service_healthy"): chỉ chờ container config-service khởi
      # động, không chờ healthcheck pass — media-service phải chạy được kể cả khi config-service
      # chưa sẵn sàng hẳn (ConfigServiceFeatureProvider tự fallback về default-storage-provider),
      # chặn cứng ở đây sẽ phá vỡ đúng tính chất resilience đó.
      config-service: { condition: service_started }
    environment:
      SPRING_APPLICATION_NAME: "media-service"
      OTEL_SERVICE_NAME: "media-service"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/media_service?replicaSet=rs0"
      # application-dev.yml trỏ slot "aws-s3" (MinIO) tới localhost:9010; bên trong network của
      # compose đó là chính container media-service, không phải media-minio — ghi đè bằng
      # hostname container. AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY không cần map qua property
      # Spring nào cả: DefaultCredentialsProvider (dùng cho slot aws-s3) tự đọc hai biến chuẩn
      # AWS SDK này từ môi trường.
      STORAGE_PROVIDERS_AWSS3_ENDPOINT: "http://media-minio:9000"
      AWS_ACCESS_KEY_ID: "media-dev"
      AWS_SECRET_ACCESS_KEY: "media-dev-secret"
      AWS_REGION: "us-east-1"
      FEATURE_FLAGS_PROVIDER: "config-service"
      CONFIG_SERVICE_URI: "http://config-service:8500"
      # Rỗng cho tới khi có tài khoản R2/B2 thật — sự hiện diện của các biến này (dù rỗng) là điều
      # cho phép ops flip document media-storage-provider trong config-service sang
      # "cloudflare-r2"/"backblaze-b2" mà không cần redeploy media-service, chỉ cần đổ giá trị
      # thật vào rồi restart container media-service một lần.
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-novaplay-media-qa-r2}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_CDN_BASE_URL: "${R2_CDN_BASE_URL:-}"
      B2_KEY_ID: "${B2_KEY_ID:-}"
      B2_APPLICATION_KEY: "${B2_APPLICATION_KEY:-}"
      B2_ENDPOINT: "${B2_ENDPOINT:-}"
      B2_BUCKET_NAME: "${B2_BUCKET_NAME:-novaplay-media-qa-b2}"
      B2_CDN_BASE_URL: "${B2_CDN_BASE_URL:-}"

  streaming-service:
    image: "novaplay/streaming-service:${STREAMING_SERVICE_VERSION:-v0.0.1}"
    container_name: streaming-service
    <<: *microservice-base
    ports: ["8200:8200"]
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_started }
      media-minio-init: { condition: service_completed_successfully }
      movie-service: { condition: service_started }
      media-service: { condition: service_started }
    environment:
      SPRING_APPLICATION_NAME: "streaming-service"
      OTEL_SERVICE_NAME: "streaming-service"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/streaming_service?replicaSet=rs0"
      SPRING_DATA_REDIS_HOST: redis
      MOVIE_SERVICE_URI: "http://movie-service:8600"
      MEDIA_SERVICE_URI: "http://media-service:8081"
      # Cùng bucket MinIO với media-service/transcoding-worker — streaming-service tự đọc playlist
      # + ký presigned GET, không đi qua presigned PUT như media-service.
      STORAGE_PROVIDERS_AWSS3_ENDPOINT: "http://media-minio:9000"
      AWS_ACCESS_KEY_ID: "media-dev"
      AWS_SECRET_ACCESS_KEY: "media-dev-secret"
      AWS_REGION: "us-east-1"
      # PHẢI khớp giá trị ở transcoding-worker bên dưới — cùng bí mật bọc/mở khoá HLS.
      TRANSCODE_KEY_WRAP_SECRET: "${TRANSCODE_KEY_WRAP_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      PLAYBACK_TOKEN_SECRET: "${PLAYBACK_TOKEN_SECRET:-MTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTBhYmNkZWY=}"

  transcoding-worker:
    image: "novaplay/transcoding-worker:${TRANSCODING_WORKER_VERSION:-v0.0.1}"
    container_name: transcoding-worker
    <<: *microservice-base
    ports: ["8400:8400"]
    depends_on:
      kafka-services: { condition: service_healthy }
      media-minio-init: { condition: service_completed_successfully }
      media-service: { condition: service_started }
    environment:
      SPRING_APPLICATION_NAME: "transcoding-worker"
      OTEL_SERVICE_NAME: "transcoding-worker"
      MEDIA_SERVICE_URI: "http://media-service:8081"
      STORAGE_PROVIDERS_AWSS3_ENDPOINT: "http://media-minio:9000"
      AWS_ACCESS_KEY_ID: "media-dev"
      AWS_SECRET_ACCESS_KEY: "media-dev-secret"
      AWS_REGION: "us-east-1"
      # PHẢI khớp giá trị ở streaming-service phía trên.
      TRANSCODE_KEY_WRAP_SECRET: "${TRANSCODE_KEY_WRAP_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"

  notification-service:
    image: "novaplay/notification-service:${NOTIFICATION_SERVICE_VERSION:-v0.0.1}"
    container_name: notification-service
    <<: *microservice-base
    ports: ["8900:8900"]
    depends_on:
      mongodb: { condition: service_healthy }
      kafka-services: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "notification-service"
      OTEL_SERVICE_NAME: "notification-service"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/notification_service?replicaSet=rs0"
      SPRING_DATA_REDIS_HOST: redis
      # application-dev.yml đã trỏ sẵn Brevo (smtp-relay.brevo.com:587) — chỉ còn thiếu login,
      # SMTP key thật + from-address, lấy từ docker-compose/qa/.env (xem .env.example cùng thư mục).
      SPRING_MAIL_USERNAME: "${BREVO_SMTP_LOGIN:?Thiếu BREVO_SMTP_LOGIN, xem docker-compose/qa/.env.example}"
      SPRING_MAIL_PASSWORD: "${BREVO_SMTP_KEY:?Thiếu BREVO_SMTP_KEY, xem docker-compose/qa/.env.example}"
      APPLICATION_MAIL_FROM: "${MAIL_FROM:-dev@novaplay.local}"
      APPLICATION_FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:3000}"

  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    image: "novaplay/apigateway:${API_GATEWAY_VERSION:-v1.0.0}"
    container_name: api-gateway
    <<: *microservice-base
    ports: ["8072:8072"]
    #    depends_on:
    #      auth-service: { condition: service_healthy }
    #      user-service: { condition: service_healthy }
    #      media-service: { condition: service_healthy }
    environment:
      SPRING_APPLICATION_NAME: "api-gateway"
      OTEL_SERVICE_NAME: "api-gateway"
      JAVA_TOOL_OPTIONS: "-javaagent:/app/libs/opentelemetry-javaagent.jar"
      SPRING_DATA_REDIS_HOST: redis
      # Container chạy profile "dev" (localhost mặc định trong yml), nhưng bên trong network
      # của compose, mỗi service khác là một container riêng có tên chính là service key —
      # ghi đè các biến này để gateway gọi đúng hostname thay vì localhost.
      AUTH_SERVICE_URI: "http://auth-service:8000"
      USER_SERVICE_URI: "http://user-service:8700"
      MOVIE_SERVICE_URI: "http://movie-service:8600"
      NOTIFICATION_SERVICE_URI: "http://notification-service:8900"
      MEDIA_SERVICE_URI: "http://media-service:8081"
