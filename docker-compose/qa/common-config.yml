services:
  network-deploy-service:
    networks:
      - novaPLay

  microservice-base-config:
    extends:
      service: network-deploy-service
    deploy:
      resources:
        limits:
          memory: 700m
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/libs/opentelemetry-javaagent-2.11.0.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # Service broker tên là "kafka-services", không phải "kafka"; và 29092 là listener
      # nội bộ dành cho traffic bên trong network (9092 chỉ dành cho client ngoài).
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-services:29092
      SPRING_PROFILES_ACTIVE: dev
