server:
  port: 8000

spring:
  liquibase:
    # Bật ở dev luôn, giống prod: schema chỉ có MỘT nguồn sự thật là db/changelog/.
    #
    # Ngoài việc tránh lệch dev/prod, đây còn là cách duy nhất để dev có function outbox_notify()
    # và trigger outbox_notify_trg — chúng không phải entity JPA nên ddl-auto=update không bao giờ
    # tạo ra chúng. Thiếu trigger thì outbox chỉ chảy mỗi khi có lượt poll/catch-up, và triệu
    # chứng là "đăng ký xong mãi mới nhận được mail" mà log không có lỗi nào.
    enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # validate chứ không phải update: Liquibase đã dựng schema ở trên, để Hibernate sửa thêm sẽ
      # tạo ra lệch âm thầm giữa DB dev và changelog — đúng thứ khiến prod fail lúc validate.
      #
      # Đánh đổi có chủ đích: sửa entity ở dev nay BẮT BUỘC phải kèm một changeset mới trong
      # db/changelog/changes/. Đổi lại, changeset hỏng bị phát hiện ngay trên máy bạn.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        compression.type: lz4

jwt:
  private-key-path: ${PRIVATE_KEY_PATH:classpath:keys/private.pem}
  public-key-path: ${PUBLIC_KEY_PATH:classpath:keys/public.pem}
  access-token:
    expiration: 86400000
  refresh-token:
    expiration: 604800000
auth:
  jwt:
    issuer: novaplay-auth
    audience: novaplay
    kid: v1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    vn:
      iotstar:
        authservice: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"
