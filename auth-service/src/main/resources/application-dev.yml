server:
  port: 8000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        compression.type: lz4

jwt:
  private-key-path: ${PRIVATE_KEY_PATH:classpath:keys/private.pem}
  public-key-path: ${PUBLIC_KEY_PATH:classpath:keys/public.pem}
  access-token:
    expiration: 86400000
  refresh-token:
    expiration: 604800000
auth:
  jwt:
    issuer: novaplay-auth
    audience: novaplay
    kid: v1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    vn:
      iotstar:
        authservice: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"

application:
  security:
    gateway-secret:
      # Tắt ở dev để gọi thẳng localhost:8000 (curl/Postman/IDE) mà không phải giả header.
      enabled: false
      value: ${GATEWAY_SHARED_SECRET:}

novaplay:
  outbox:
    # Đường CHÍNH: sau khi transaction COMMIT thì đẩy thẳng id sang relay trong cùng JVM.
    relay-after-commit: ${OUTBOX_RELAY_AFTER_COMMIT:true}
    # LƯỚI AN TOÀN: quét bù row mà pod chết bỏ lại giữa COMMIT và relay. Không phải đường chính
    # nên chu kỳ để thưa — kéo ngắn lại không làm event tới nhanh hơn, chỉ tốn thêm query.
    sweep-enabled: ${OUTBOX_SWEEP_ENABLED:true}
    sweep-interval: ${OUTBOX_SWEEP_INTERVAL:60s}
    # LISTEN/NOTIFY: chỉ bật khi DATASOURCE_URL trỏ THẲNG tới Postgres. Qua connection pooler
    # (Supavisor của Supabase, PgBouncer) sẽ lặp vô hạn lỗi "Unknown Response Type S".
    listen-enabled: ${OUTBOX_LISTEN_ENABLED:false}
