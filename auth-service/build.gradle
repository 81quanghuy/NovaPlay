plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'vn.iotstar'
version = '0.0.1'
description = 'auth-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    springCloudVersion = '2025.1.2'
    springdocVersion = '3.0.1'
    jjwtVersion = '0.12.7'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-gson:${jjwtVersion}"

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Không còn runtimeOnly được: OutboxNotificationListener nay nằm trong service này và biên dịch
    // trực tiếp với PGConnection/PGNotification để nghe LISTEN/NOTIFY của Postgres.
    implementation 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Schema Postgres do Liquibase quản lý, KHÔNG do Hibernate (ddl-auto=validate ở cả dev lẫn prod).
    //
    // Phải là starter, KHÔNG phải 'org.liquibase:liquibase-core' trần: Spring Boot 4 đã tách
    // autoconfiguration ra khỏi spring-boot-autoconfigure thành từng module riêng
    // (spring-boot-liquibase, giống spring-boot-kafka ở dưới). Chỉ khai liquibase-core thì thư
    // viện có mặt nhưng LiquibaseAutoConfiguration thì không — spring.liquibase.* bị bỏ qua và
    // migration lặng lẽ không bao giờ chạy, cho tới khi Hibernate validate fail ở prod.
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
