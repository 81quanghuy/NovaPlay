spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017/notification_service
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      timeout: 5s
  kafka:
    bootstrap-servers: localhost:9092
  mail:
    # Brevo SMTP relay — cùng endpoint với prod. Khác SendGrid: username KHÔNG phải literal cố
    # định mà là email đăng nhập Brevo, và password là "SMTP key" (khác API key) — cả hai đọc
    # từ biến môi trường MAIL_USERNAME/MAIL_PASSWORD (docker-compose/qa/.env,
    # k8s/infra/dev-secrets.env, hoặc export tay khi chạy mvnw trực tiếp). Thiếu biến này thì
    # gửi mail lỗi auth, KHÔNG lỗi lúc khởi động. Cách lấy 2 giá trị này: app.brevo.com -> icon
    # avatar góc phải -> "SMTP & API" -> tab "SMTP".
    host: smtp-relay.brevo.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8900
  shutdown: graceful

application:
  security:
    gateway-secret:
      # Tắt ở local để gọi thẳng service khi dev; PROD bắt buộc bật.
      enabled: false
  mail:
    # Phải là địa chỉ đã verify (mục "Senders") trên Brevo, nếu không mọi email test đều bị
    # Brevo từ chối ở tầng API.
    from: ${MAIL_FROM:dev@novaplay.local}
  frontend:
    base-url: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo,redis,mongoIndex
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: DEBUG
