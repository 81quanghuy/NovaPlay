<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 10px 0 20px; color: #1677ff; font-size: 24px; font-weight: bold; }
        h2 { text-align: center; }
        .body { white-space: pre-line; }
        .footer { text-align: center; margin-top: 30px; color: #888; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <header>NOVAPLAY</header>
    <h2 th:text="${title}">Thông báo</h2>
    <p class="body" th:text="${body}">Nội dung thông báo.</p>
    <div class="footer">
        <p>&copy; NovaPlay</p>
    </div>
</div>
</body>
</html>
