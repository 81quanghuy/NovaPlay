# Bundle mặc định (tiếng Việt) — dùng khi locale của sự kiện không khớp _vi hay _en.
#
# messages_vi.properties tồn tại song song và trùng nội dung với file này một cách có chủ đích:
# ResourceBundle chỉ dùng bundle cơ sở SAU KHI đã thử bundle của locale mặc định của JVM. Nếu
# thiếu messages_vi và JVM chạy với locale en, người dùng yêu cầu vi-VN sẽ nhận email tiếng Anh.
# spring.messages.fallback-to-system-locale=false trong application.yml chặn nốt đường còn lại.

