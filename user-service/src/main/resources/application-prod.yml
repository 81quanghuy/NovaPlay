# Cấu hình production. Mọi giá trị nhạy cảm và phụ thuộc môi trường đều đến từ biến môi
# trường — không có credential nào được commit vào file này.
#
# Biến bắt buộc: MONGODB_URI, KAFKA_BOOTSTRAP_SERVERS, REDIS_HOST, GATEWAY_SHARED_SECRET
spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      # Phải trỏ tới một replica set: MongoDB chỉ hỗ trợ transaction trên replica set.
      uri: ${MONGODB_URI}
      auto-index-creation: true
      # MongoIndexInitializer vẫn kiểm tra lại lúc khởi động vì auto-index-creation chạy lazy
      # theo từng entity và nuốt lỗi im lặng.
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

  lifecycle:
    # Cho request đang chạy kịp hoàn tất trước khi tiến trình dừng hẳn.
    timeout-per-shutdown-phase: 30s

  cloud:
    openfeign:
      # Feign mặc định là 10s connect / 60s read — quá dài, đủ để làm cạn thread pool
      # khi service phụ thuộc bị chậm.
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
      circuitbreaker:
        enabled: true

server:
  port: ${SERVER_PORT:8700}
  shutdown: graceful

application:
  security:
    gateway-secret:
      # Bắt buộc bật ở production: nếu không, bất kỳ ai chạm được tới cổng service đều mạo danh
      # được người dùng bất kỳ bằng cách tự đặt header X-User-Email.
      enabled: true
      value: ${GATEWAY_SHARED_SECRET}
  mongodb:
    transactions-enabled: true

services:
  media: ${MEDIA_SERVICE_URI:http://media-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Pod thiếu unique index hoặc mất kết nối tới datastore không được nhận traffic.
        readiness:
          include: readinessState,mongo,redis,mongoIndex
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      # Lấy mẫu toàn bộ ở production quá tốn kém cả về chi phí lẫn độ trễ.
      probability: ${TRACING_SAMPLE_RATE:0.1}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: INFO

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      mediaService:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
    instances:
      mediaService:
        timeout-duration: 5s
  retry:
    instances:
      mediaService:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
