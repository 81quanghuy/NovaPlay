# Cấu hình production. Mọi giá trị nhạy cảm và phụ thuộc môi trường đều đến từ biến môi
# trường — không có credential nào được commit vào file này.
#
# Biến bắt buộc: MONGODB_URI, KAFKA_BOOTSTRAP_SERVERS, REDIS_HOST, GATEWAY_SHARED_SECRET
spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      # Phải trỏ tới một replica set: MongoDB chỉ hỗ trợ transaction trên replica set.
      uri: ${MONGODB_URI}
      auto-index-creation: true
      # MongoIndexInitializer vẫn kiểm tra lại lúc khởi động vì auto-index-creation chạy lazy
      # theo từng entity và nuốt lỗi im lặng.
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    # --- Kết nối Kafka managed (Aiven) -------------------------------------------------------
    # Mặc định giữ NGUYÊN hành vi cũ (PLAINTEXT, không SASL) để Kafka in-cluster, docker-compose
    # và Testcontainers trong CI không phải đổi gì. Aiven bật bằng 3 biến môi trường:
    # KAFKA_SECURITY_PROTOCOL=SASL_SSL, KAFKA_SASL_USERNAME, KAFKA_SASL_PASSWORD.
    #
    # CA LÀ BẮT BUỘC, không phải tuỳ chọn: chứng chỉ broker của Aiven do CA riêng của từng
    # project ký, JVM không tin sẵn — thiếu nó lỗi là SSLHandshakeException lúc bắt tay chứ
    # không phải "sai mật khẩu", rất dễ chẩn đoán nhầm. File PEM được Kafka client nạp thẳng
    # (ssl.truststore.type=PEM, hỗ trợ từ client 2.7), KHÔNG cần dựng JKS bằng keytool.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    ssl:
      trust-store-type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
      # Default trỏ tới đường dẫn mount trong Pod. File không tồn tại cũng vô hại khi protocol
      # là PLAINTEXT: Spring chỉ đổi Resource thành absolute path lúc dựng config, không mở file;
      # chỉ SSL channel builder mới thật sự đọc.
      trust-store-location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:file:/etc/novaplay/kafka/ca.pem}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      # Username/password tách riêng thành 2 biến thay vì dán nguyên chuỗi JAAS vào env: chuỗi
      # JAAS có dấu cách, mà apply-dev-secrets.sh dựng tham số kubectl theo dòng — giá trị có
      # dấu cách sẽ bị tách thành nhiều tham số và Secret ra sai.
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:}" password="${KAFKA_SASL_PASSWORD:}";'
    admin:
      # Đặt false trên Aiven free tier. Quota free là 5 topic x 2 partition, trong khi các
      # NewTopic bean của repo khai báo 11 topic (kể cả .DLT) phần lớn 3 partition -> KafkaAdmin
      # sẽ ném lỗi tạo topic ở MỖI lần khởi động service. Topic tạo tay trong Aiven Console,
      # danh sách chính xác nằm ở k8s/infra/README.md.
      auto-create: ${KAFKA_ADMIN_AUTO_CREATE:true}

  lifecycle:
    # Cho request đang chạy kịp hoàn tất trước khi tiến trình dừng hẳn.
    timeout-per-shutdown-phase: 30s

  cloud:
    openfeign:
      # Feign mặc định là 10s connect / 60s read — quá dài, đủ để làm cạn thread pool
      # khi service phụ thuộc bị chậm.
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
      circuitbreaker:
        enabled: true

server:
  port: ${SERVER_PORT:8700}
  shutdown: graceful

application:
  security:
    gateway-secret:
      # Bắt buộc bật ở production: nếu không, bất kỳ ai chạm được tới cổng service đều mạo danh
      # được người dùng bất kỳ bằng cách tự đặt header X-User-Email.
      enabled: true
      value: ${GATEWAY_SHARED_SECRET}
  mongodb:
    transactions-enabled: true

services:
  media: ${MEDIA_SERVICE_URI:http://media-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Pod thiếu unique index hoặc mất kết nối tới datastore không được nhận traffic.
        readiness:
          include: readinessState,mongo,redis,mongoIndex
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      # Lấy mẫu toàn bộ ở production quá tốn kém cả về chi phí lẫn độ trễ.
      probability: ${TRACING_SAMPLE_RATE:0.1}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: INFO

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      mediaService:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
    instances:
      mediaService:
        timeout-duration: 5s
  retry:
    instances:
      mediaService:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
