# Chỉ chứa những gì đúng cho MỌI môi trường. Cấu hình riêng theo môi trường nằm ở
# application-<profile>.yml, chọn bằng SPRING_PROFILES_ACTIVE.
#
# Cố tình KHÔNG đặt spring.profiles.active ở đây: nướng cứng một profile vào jar khiến bản
# build production chạy bằng cấu hình dev nếu ai đó quên override.
spring:
  application:
    name: transcoding-worker

# @FeignClient(url = "${services.media}") resolve giá trị này ngay lúc đăng ký bean định nghĩa
# (context startup) — thiếu default ở base file này làm FeignClientsRegistrar nhận nguyên chuỗi
# chưa resolve và ném URISyntaxException, xem media-service/application.yml cho tiền lệ.
services:
  media: ${MEDIA_SERVICE_URI:http://localhost:8081}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"
