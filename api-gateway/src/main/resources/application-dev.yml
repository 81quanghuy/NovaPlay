server:
  port: 8072

spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      httpclient:
        connect-timeout: 1000
        response-timeout: 10s
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service-cb
                fallbackUri: forward:/fallback/message
            - name: Retry
              args:
                retries: 3
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: true
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userEmailOrIpKeyResolver}"

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-service-cb
                fallbackUri: forward:/fallback/message
            - name: Retry
              args:
                retries: 3
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: true
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userEmailOrIpKeyResolver}"

        - id: movie-service
          uri: lb://movie-service
          predicates:
            - Path=/api/v1/movies/**
          filters:
            - name: CircuitBreaker
              args:
                name: movie-service-cb
                fallbackUri: forward:/fallback/message
            - name: Retry
              args:
                retries: 3
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: true

        - id: auth-service-swagger
          uri: lb://auth-service
          predicates:
            - Path=/swagger/auth/v3/api-docs
          filters:
            - RewritePath=/swagger/auth/(?<segment>.*), /${segment}

        - id: user-service-swagger
          uri: lb://user-service
          predicates:
            - Path=/swagger/user/v3/api-docs
          filters:
            - RewritePath=/swagger/user/(?<segment>.*), /${segment}

        - id: movie-service-swagger
          uri: lb://movie-service
          predicates:
            - Path=/swagger/movie/v3/api-docs
          filters:
            - RewritePath=/swagger/movie/(?<segment>.*), /${segment}

rsa:
  public:
    key-location: classpath:certs/public.pem

auth:
  jwt:
    issuer: novaplay-auth
    audience: novaplay
    kid: v1

application:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173
  security:
    # Bí mật dùng chung để chứng minh với service downstream rằng request đã đi qua gateway.
    # Để trống ở dev; production phải cấp qua biến môi trường và phải khớp với giá trị
    # cấu hình ở downstream, nếu lệch thì mọi request sẽ bị trả 403.
    gateway-secret: ${GATEWAY_SHARED_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    vn:
      iotstar:
        apigateway: DEBUG
    org:
      springframework:
        cloud:
          gateway: INFO
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
    instances:
      auth-service-cb:
        base-config: default
      user-service-cb:
        base-config: default
      movie-service-cb:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
    instances:
      auth-service-cb:
        base-config: default
      user-service-cb:
        base-config: default
      movie-service-cb:
        base-config: default
