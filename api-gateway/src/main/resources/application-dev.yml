server:
  port: 8072

spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s
  cloud:
    openfeign:
      blocking:
        enabled: true
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s

          routes:
            - id: auth-service
              uri: ${services.auth}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service-cb
                    fallbackUri: forward:/fallback/message

                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: user-service
              uri: ${services.user}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service-cb
                    fallbackUri: forward:/fallback/message

                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: movie-service
              uri: ${services.movie}
              predicates:
                - Path=/api/v1/movies/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: movie-service-cb
                    fallbackUri: forward:/fallback/message

                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: genre-service
              uri: ${services.movie}
              predicates:
                - Path=/api/v1/genres/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: movie-service-cb
                    fallbackUri: forward:/fallback/message

                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: artist-service
              uri: ${services.movie}
              predicates:
                - Path=/api/v1/artists/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: movie-service-cb
                    fallbackUri: forward:/fallback/message

                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: notification-service
              uri: ${services.notification}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service-cb
                    fallbackUri: forward:/fallback/message

                # Chỉ retry GET.
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: media-service
              uri: ${services.media}
              predicates:
                - Path=/api/v1/media/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: media-service-cb
                    fallbackUri: forward:/fallback/message

                # Chỉ retry GET.
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            # Route riêng cho /hls/**, phải đứng TRƯỚC route streaming-service bên dưới: Spring
            # Cloud Gateway khớp route theo thứ tự khai báo, và /hls/** là tập con của /**. Giới
            # hạn tần suất cao hơn hẳn (một phiên xem gọi playlist/segment rất nhiều lần) — không
            # dùng chung mức 30/60 của route đọc-công-khai thông thường bên dưới.
            - id: streaming-service-hls
              uri: ${services.streaming}
              predicates:
                - Path=/api/v1/streaming/hls/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: streaming-service-cb
                    fallbackUri: forward:/fallback/message

                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 400
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: streaming-service
              uri: ${services.streaming}
              predicates:
                - Path=/api/v1/streaming/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: streaming-service-cb
                    fallbackUri: forward:/fallback/message

                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: auth-service-swagger
              uri: ${services.auth}
              predicates:
                - Path=/swagger/auth/v3/api-docs
              filters:
                - RewritePath=/swagger/auth/(?<segment>.*), /${segment}

            - id: user-service-swagger
              uri: ${services.user}
              predicates:
                - Path=/swagger/user/v3/api-docs
              filters:
                - RewritePath=/swagger/user/(?<segment>.*), /${segment}

            - id: movie-service-swagger
              uri: ${services.movie}
              predicates:
                - Path=/swagger/movie/v3/api-docs
              filters:
                - RewritePath=/swagger/movie/(?<segment>.*), /${segment}

            - id: notification-service-swagger
              uri: ${services.notification}
              predicates:
                - Path=/swagger/notification/v3/api-docs
              filters:
                - RewritePath=/swagger/notification/(?<segment>.*), /${segment}

            - id: media-service-swagger
              uri: ${services.media}
              predicates:
                - Path=/swagger/media/v3/api-docs
              filters:
                - RewritePath=/swagger/media/(?<segment>.*), /${segment}

            - id: streaming-service-swagger
              uri: ${services.streaming}
              predicates:
                - Path=/swagger/streaming/v3/api-docs
              filters:
                - RewritePath=/swagger/streaming/(?<segment>.*), /${segment}
services:
  auth: ${AUTH_SERVICE_URI:http://localhost:8000}
  user: ${USER_SERVICE_URI:http://localhost:8700}
  movie: ${MOVIE_SERVICE_URI:http://localhost:8600}
  notification: ${NOTIFICATION_SERVICE_URI:http://localhost:8900}
  media: ${MEDIA_SERVICE_URI:http://localhost:8081}
  streaming: ${STREAMING_SERVICE_URI:http://localhost:8200}

auth:
  jwt:
    issuer: novaplay-auth
    audience: novaplay
    kid: v1

application:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173
  security:
    gateway-secret: ${GATEWAY_SHARED_SECRET:}

springdoc:
  swagger-ui:
    urls:
      - name: auth
        url: /swagger/auth/v3/api-docs
      - name: user
        url: /swagger/user/v3/api-docs
      - name: movie
        url: /swagger/movie/v3/api-docs
      - name: notification
        url: /swagger/notification/v3/api-docs
      - name: media
        url: /swagger/media/v3/api-docs
      - name: streaming
        url: /swagger/streaming/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    vn:
      iotstar:
        apigateway: DEBUG
    org:
      springframework:
        cloud:
          gateway: INFO
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
    instances:
      auth-service-cb:
        base-config: default
      user-service-cb:
        base-config: default
      movie-service-cb:
        base-config: default
      notification-service-cb:
        base-config: default
      media-service-cb:
        base-config: default
      streaming-service-cb:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
    instances:
      auth-service-cb:
        base-config: default
      user-service-cb:
        base-config: default
      movie-service-cb:
        base-config: default
      notification-service-cb:
        base-config: default
      media-service-cb:
        base-config: default
      streaming-service-cb:
        base-config: default
