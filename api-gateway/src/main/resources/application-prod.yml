# Cấu hình production. Mọi giá trị nhạy cảm và phụ thuộc môi trường đều đến từ biến môi
# trường — không có credential nào được commit vào file này.
#
# Biến bắt buộc: GATEWAY_SHARED_SECRET, REDIS_HOST
server:
  port: ${SERVER_PORT:8072}
  shutdown: graceful

spring:
  config:
    activate:
      on-profile: prod
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      connect-timeout: 2s
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s
          routes:
            - id: auth-service
              uri: ${services.auth}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service-cb
                    fallbackUri: forward:/fallback/message
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: user-service
              uri: ${services.user}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service-cb
                    fallbackUri: forward:/fallback/message
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: movie-service
              uri: ${services.movie}
              predicates:
                - Path=/api/v1/movies/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: movie-service-cb
                    fallbackUri: forward:/fallback/message
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: genre-service
              uri: ${services.movie}
              predicates:
                - Path=/api/v1/genres/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: movie-service-cb
                    fallbackUri: forward:/fallback/message
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: artist-service
              uri: ${services.movie}
              predicates:
                - Path=/api/v1/artists/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: movie-service-cb
                    fallbackUri: forward:/fallback/message
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: notification-service
              uri: ${services.notification}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service-cb
                    fallbackUri: forward:/fallback/message
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            # Upload/quản lý media của người dùng đã đăng nhập — không phải catalog công khai, nên
            # hạn mức giống notification-service chứ không rộng như movie-service.
            - id: media-service
              uri: ${services.media}
              predicates:
                - Path=/api/v1/media/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: media-service-cb
                    fallbackUri: forward:/fallback/message
                # Chỉ retry GET: POST xin presigned URL và DELETE là thao tác ghi, retry chỉ làm
                # tăng tải chứ không sửa được nguyên nhân lỗi.
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            # Route riêng cho /hls/**, phải đứng TRƯỚC route streaming-service bên dưới — xem
            # giải thích ở application-dev.yml.
            - id: streaming-service-hls
              uri: ${services.streaming}
              predicates:
                - Path=/api/v1/streaming/hls/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: streaming-service-cb
                    fallbackUri: forward:/fallback/message
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 400
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: streaming-service
              uri: ${services.streaming}
              predicates:
                - Path=/api/v1/streaming/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: streaming-service-cb
                    fallbackUri: forward:/fallback/message
                - name: Retry
                  args:
                    retries: 3
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    key-resolver: "#{@userEmailOrIpKeyResolver}"

            - id: auth-service-swagger
              uri: ${services.auth}
              predicates:
                - Path=/swagger/auth/v3/api-docs
              filters:
                - RewritePath=/swagger/auth/(?<segment>.*), /${segment}

            - id: user-service-swagger
              uri: ${services.user}
              predicates:
                - Path=/swagger/user/v3/api-docs
              filters:
                - RewritePath=/swagger/user/(?<segment>.*), /${segment}

            - id: movie-service-swagger
              uri: ${services.movie}
              predicates:
                - Path=/swagger/movie/v3/api-docs
              filters:
                - RewritePath=/swagger/movie/(?<segment>.*), /${segment}

            - id: notification-service-swagger
              uri: ${services.notification}
              predicates:
                - Path=/swagger/notification/v3/api-docs
              filters:
                - RewritePath=/swagger/notification/(?<segment>.*), /${segment}

            - id: media-service-swagger
              uri: ${services.media}
              predicates:
                - Path=/swagger/media/v3/api-docs
              filters:
                - RewritePath=/swagger/media/(?<segment>.*), /${segment}

            - id: streaming-service-swagger
              uri: ${services.streaming}
              predicates:
                - Path=/swagger/streaming/v3/api-docs
              filters:
                - RewritePath=/swagger/streaming/(?<segment>.*), /${segment}

services:
  auth: ${AUTH_SERVICE_URI:http://auth-service:8000}
  user: ${USER_SERVICE_URI:http://user-service:8700}
  movie: ${MOVIE_SERVICE_URI:http://movie-service:8600}
  notification: ${NOTIFICATION_SERVICE_URI:http://notification-service:8900}
  media: ${MEDIA_SERVICE_URI:http://media-service:8081}
  streaming: ${STREAMING_SERVICE_URI:http://streaming-service:8200}

rsa:
  public:
    key-location: classpath:certs/public.pem

auth:
  jwt:
    issuer: novaplay-auth
    audience: novaplay
    kid: v1

application:
  cors:
    # Domain thật của frontend production. Nếu frontend triển khai thêm domain khác (ví dụ
    # staging), thêm dòng ở đây rồi build lại image — danh sách này không đọc từ biến môi trường
    # vì CorsProperties.allowedOrigins là List<String> qua @ConfigurationProperties, không nhận
    # binding tin cậy từ một biến môi trường CSV đơn.
    allowed-origins:
      - https://novaplay.vn
  security:
    gateway-secret: ${GATEWAY_SHARED_SECRET}

springdoc:
  swagger-ui:
    urls:
      - name: auth
        url: /swagger/auth/v3/api-docs
      - name: user
        url: /swagger/user/v3/api-docs
      - name: movie
        url: /swagger/movie/v3/api-docs
      - name: notification
        url: /swagger/notification/v3/api-docs
      - name: media
        url: /swagger/media/v3/api-docs
      - name: streaming
        url: /swagger/streaming/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: INFO
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
    instances:
      auth-service-cb:
        base-config: default
      user-service-cb:
        base-config: default
      movie-service-cb:
        base-config: default
      notification-service-cb:
        base-config: default
      media-service-cb:
        base-config: default
      streaming-service-cb:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
    instances:
      auth-service-cb:
        base-config: default
      user-service-cb:
        base-config: default
      movie-service-cb:
        base-config: default
      notification-service-cb:
        base-config: default
      media-service-cb:
        base-config: default
      streaming-service-cb:
        base-config: default
