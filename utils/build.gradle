plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'vn.iotstar'
version = '0.0.1'
description = 'utils for all services'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// utils/pom.xml (Maven, Boot 3.5.0) vẫn là nguồn build cho 8 service khác trong reactor và biên
// dịch src/main/java nguyên trạng. Boot 4.1 tách KafkaProperties sang gói/module mới
// (org.springframework.boot.kafka.autoconfigure), nên OutboxConfiguration bản Boot 3.5 không còn
// biên dịch được ở đây. Loại file đó khỏi build Gradle và thay bằng bản đã cập nhật import,
// đặt riêng ngoài src/main/java để Maven không nhìn thấy và không bị ảnh hưởng.
sourceSets {
    main {
        java {
            srcDir 'src/gradle/java'
            // exclude() trên SourceDirectorySet áp dụng cho MỌI srcDir (kể cả src/gradle/java vừa
            // thêm), nên không thể loại bản Maven bằng pattern tương đối thông thường — phải so
            // đường dẫn tuyệt đối để chỉ loại đúng file nằm trong src/main/java.
            exclude { it.file.path.replace(File.separatorChar, '/' as char)
                    .endsWith('src/main/java/vn/iotstar/outbox/OutboxConfiguration.java') }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
    }
}

dependencies {
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework.data:spring-data-commons'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.30'
    api 'org.springframework.security:spring-security-core'
    api 'org.springframework.security:spring-security-oauth2-jose'
    api 'org.springframework.data:spring-data-jpa'
    api 'jakarta.validation:jakarta.validation-api'

    // Phục vụ package vn.iotstar.outbox. compileOnly vì không transitive: service nào dùng
    // outbox thì tự khai báo bản của mình (auth-service, promotion-service đều đã có sẵn cả ba),
    // còn các service Mongo không bị kéo Kafka và driver Postgres vào classpath một cách vô cớ.
    compileOnly 'org.springframework.kafka:spring-kafka'
    compileOnly 'org.springframework.boot:spring-boot-kafka'
    compileOnly 'org.postgresql:postgresql'
    compileOnly 'io.micrometer:micrometer-core'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.awaitility:awaitility'
}

tasks.named('test') {
    useJUnitPlatform()
}
