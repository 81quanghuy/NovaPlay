name: media-service CI

on:
  push:
    branches: [main]
    paths:
      - 'media-service/**'
      - 'pom.xml'
      - '.github/workflows/media-service-ci.yml'
  pull_request:
    paths:
      - 'media-service/**'
      - 'pom.xml'
      - '.github/workflows/media-service-ci.yml'

# Push mới lên cùng một branch sẽ huỷ lượt chạy đang dở.
concurrency:
  group: media-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Service vẫn kế thừa pom cha ở gốc repo, nên pom đó phải nằm trong local repo
      # trước khi build module con. -N chỉ cài đúng pom cha, không build module nào.
      - name: Install parent POM
        run: ./mvnw -B -q install -N

      # verify chạy cả unit test (surefire) lẫn integration test (failsafe), trong đó có
      # S3UploadFlowIT (LocalStack qua Testcontainers). Bước tiếp theo kiểm tra IT đó THẬT SỰ
      # chạy chứ không tự bỏ qua — xem comment ở bước đó để biết lý do.
      - name: Build and test media-service
        run: ./mvnw -B verify -pl media-service -am

      # GUARD — KHÔNG xoá bước này vì tưởng là thừa.
      #
      # Testcontainers 1.21.0 (bị ghim bởi Spring Boot 3.5.0 BOM) đóng gói docker-java 3.4.2, và
      # thư viện đó thương lượng Docker API ở bản 1.32. Docker daemon hiện đại (Engine 29.x trở
      # lên) yêu cầu API >= 1.40 và từ chối kết nối với lỗi "client version 1.32 is too old".
      # Mọi test *IT trong repo này tự bảo vệ mình bằng @EnabledIf("dockerAvailable") ->
      # DockerClientFactory.instance().isDockerAvailable(), và hàm đó âm thầm trả về false khi
      # gặp tình huống trên — test bị SKIP thay vì chạy, còn `mvn verify` ở bước trên vẫn báo
      # SUCCESS như thường. Nói cách khác: một lần chạy CI mà Testcontainers không bao giờ nói
      # chuyện được với Docker trông giống hệt một lần chạy mà mọi IT đều pass. Bước này đọc
      # thẳng báo cáo XML của failsafe để phân biệt hai trường hợp đó, và làm ĐỎ build nếu bất kỳ
      # test *IT nào bị skip thay vì thật sự thực thi.
      - name: Verify integration tests actually ran (did not silently skip)
        run: |
          set -euo pipefail
          REPORT_DIR="media-service/target/failsafe-reports"

          if [ ! -d "$REPORT_DIR" ]; then
            echo "::error::$REPORT_DIR không tồn tại — failsafe (integration-test) có thể chưa từng chạy."
            exit 1
          fi

          # "*IT*" chứ không phải "*IT" ở cuối: failsafe mặc định còn nhận diện IT theo
          # "IT*.java" (tiền tố) và "*ITCase.java" (hậu tố khác), không chỉ hậu tố "*IT.java".
          # Khớp hẹp hơn thì một service tương lai đặt tên theo hai pattern kia sẽ lọt lưới guard
          # này — đúng kiểu lỗi mà guard tồn tại để chặn.
          reports=$(find "$REPORT_DIR" -maxdepth 1 -name 'TEST-*IT*.xml')
          if [ -z "$reports" ]; then
            echo "::error::Không tìm thấy report *IT nào trong $REPORT_DIR — integration test không hề chạy."
            exit 1
          fi

          failed=0
          while IFS= read -r report; do
            name=$(basename "$report")
            tests=$(grep -oE 'tests="[0-9]+"' "$report" | head -1 | grep -oE '[0-9]+' || true)
            skipped=$(grep -oE 'skipped="[0-9]+"' "$report" | head -1 | grep -oE '[0-9]+' || true)
            echo "$name: tests=${tests:-?} skipped=${skipped:-?}"

            if [ -z "$tests" ] || [ "$tests" -lt 1 ] || [ -z "$skipped" ] || [ "$skipped" -gt 0 ]; then
              echo "::error::$name — tests=${tests:-0}, skipped=${skipped:-0}. Test *IT này đã bị SKIP thay vì chạy thật."
              failed=1
            fi
          done <<< "$reports"

          if [ "$failed" -eq 1 ]; then
            echo "::error::Một hoặc nhiều test *IT bị skip. Nguyên nhân nhiều khả năng là runner này không" \
                 "thoả điều kiện Docker API mà Testcontainers/docker-java 3.4.2 cần (xem comment ở bước trên)," \
                 "KHÔNG PHẢI vì thật sự không còn integration test nào. 'mvn verify' xanh KHÔNG có nghĩa là IT" \
                 "đã chạy — đừng nới lỏng guard này để build xanh trở lại, hãy sửa gốc rễ (nâng cấp Testcontainers)."
            exit 1
          fi

          echo "Toàn bộ test *IT đã thực thi thật, không có test nào bị skip."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-service-test-reports
          path: |
            media-service/target/surefire-reports/
            media-service/target/failsafe-reports/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    # packages: write là thứ cho phép GITHUB_TOKEN push lên ghcr.io. Thiếu dòng này, login
    # vẫn qua nhưng push trả 403 — và thông báo lỗi không hề nhắc tới permissions.
    permissions:
      # contents: write (không phải read) — bước cuối commit tag đã ghim ngược lại repo.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Chỉ đăng nhập khi thật sự sắp push. Trên pull_request từ fork, GITHUB_TOKEN là
      # read-only nên login sẽ fail — bỏ qua để PR vẫn kiểm chứng được Dockerfile.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag theo github.sha là thứ manifest k8s tham chiếu: nó bất biến, nên biết chính xác
      # pod đang chạy commit nào và rollback là trỏ về sha cũ. Tag `latest` chỉ để tiện tay
      # — ĐừNG deploy bằng nó, vì không có cách nào biết `latest` đang trỏ vào đâu.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: media-service/Dockerfile
          # PR vẫn build để bắt lỗi Dockerfile sớm, nhưng không đẩy image rác lên registry.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/81nhuquynh/media-service:${{ github.sha }}
            ghcr.io/81nhuquynh/media-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ghim tag SHA vừa push vào overlay prod và commit ngược lại repo. Đây là mắt xích biến
      # "image đã có trên registry" thành "cluster biết phải chạy bản nào" — và cũng chính là chỗ
      # ArgoCD sau này cắm vào mà không phải sửa gì.
      #
      # 9 workflow có thể chạy song song và cùng commit vào main, nên phải rebase-retry: không có
      # vòng lặp này thì hai service merge cùng lúc sẽ có một bên fail với non-fast-forward.
      - name: Pin image tag in prod overlay
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # Cài vào RUNNER_TEMP thay vì /usr/local/bin: không phụ thuộc quyền ghi vào thư mục
          # hệ thống của runner, và tự biến mất cùng job.
          KUSTOMIZE_DIR="$RUNNER_TEMP/kustomize"
          mkdir -p "$KUSTOMIZE_DIR"
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | tar -xz -C "$KUSTOMIZE_DIR"
          export PATH="$KUSTOMIZE_DIR:$PATH"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            (cd k8s/overlays/prod && kustomize edit set image \
              ghcr.io/81nhuquynh/media-service=ghcr.io/81nhuquynh/media-service:${{ github.sha }})

            if git diff --quiet; then
              echo "Tag đã đúng, không có gì để commit."
              exit 0
            fi

            git add k8s/overlays/prod/kustomization.yaml
            git commit -m "ci(media-service): pin image to ${{ github.sha }} [skip ci]"

            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Đã ghim tag ở lần thử $attempt."
              exit 0
            fi
            echo "Push bị từ chối (có commit mới), thử lại lần $((attempt + 1))..."
            sleep $((attempt * 3))
          done

          echo "::error::Không ghim được tag sau 5 lần thử."
          exit 1
