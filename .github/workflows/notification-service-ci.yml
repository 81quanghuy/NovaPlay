name: notification-service CI

on:
  push:
    branches: [main]
    paths:
      - 'notification-service/**'
      - 'pom.xml'
      - '.github/workflows/notification-service-ci.yml'
  pull_request:
    paths:
      - 'notification-service/**'
      - 'pom.xml'
      - '.github/workflows/notification-service-ci.yml'

# Push mới lên cùng một branch sẽ huỷ lượt chạy đang dở.
concurrency:
  group: notification-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Service vẫn kế thừa pom cha ở gốc repo, nên pom đó phải nằm trong local repo
      # trước khi build module con. -N chỉ cài đúng pom cha, không build module nào.
      - name: Install parent POM
        run: ./mvnw -B -q install -N

      # verify chạy cả unit test (surefire) lẫn integration test (failsafe). Runner của GitHub
      # có sẵn Docker nên NotificationRepositoryIT chạy thật trên MongoDB qua Testcontainers;
      # trên máy không có Docker thì test đó tự bỏ qua thay vì làm đỏ build. MailDeliveryIT dùng
      # GreenMail in-process nên chạy ở mọi nơi.
      - name: Build and test notification-service
        run: ./mvnw -B verify -pl notification-service -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-test-reports
          path: |
            notification-service/target/surefire-reports/
            notification-service/target/failsafe-reports/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      # Chỉ kiểm chứng image build được. Chưa push vì chưa cấu hình registry.
      - name: Build Docker image
        run: docker build -f notification-service/Dockerfile -t novaplay/notification-service:${{ github.sha }} .
