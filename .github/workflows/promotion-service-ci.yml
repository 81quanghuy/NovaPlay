name: promotion-service CI

# KHÔNG có job docker-build: promotion-service chưa có Dockerfile, chưa có manifest trong k8s/,
# và chưa được route qua api-gateway — nó chưa phải một service được deploy. Workflow này chỉ
# giữ cho code không mục: build + test chạy mỗi lần đụng tới nó.
#
# Khi nào service này thật sự lên prod, thêm job docker-build copy từ config-service-ci.yml.
on:
  push:
    branches: [main]
    paths:
      - 'promotion-service/**'
      - 'pom.xml'
      - '.github/workflows/promotion-service-ci.yml'
  pull_request:
    paths:
      - 'promotion-service/**'
      - 'pom.xml'
      - '.github/workflows/promotion-service-ci.yml'

concurrency:
  group: promotion-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install parent POM
        run: ./mvnw -B -q install -N

      - name: Build and test promotion-service
        run: ./mvnw -B verify -pl promotion-service -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-service-test-reports
          path: |
            promotion-service/target/surefire-reports/
            promotion-service/target/failsafe-reports/
          retention-days: 7
