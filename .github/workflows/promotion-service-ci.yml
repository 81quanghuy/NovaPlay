name: promotion-service CI

on:
  push:
    branches: [main]
    paths:
      - 'promotion-service/**'
      - 'pom.xml'
      - '.github/workflows/promotion-service-ci.yml'
  pull_request:
    paths:
      - 'promotion-service/**'
      - 'pom.xml'
      - '.github/workflows/promotion-service-ci.yml'

# KHÔNG có job docker-build: promotion-service chưa có Dockerfile. Thêm Dockerfile thì thêm job đó
# theo mẫu của config-service-ci.yml (build context là gốc repo, dùng -f promotion-service/Dockerfile).

# Push mới lên cùng một branch sẽ huỷ lượt chạy đang dở.
concurrency:
  group: promotion-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Service vẫn kế thừa pom cha ở gốc repo, nên pom đó phải nằm trong local repo
      # trước khi build module con. -N chỉ cài đúng pom cha, không build module nào.
      - name: Install parent POM
        run: ./mvnw -B -q install -N

      - name: Build and test promotion-service
        run: ./mvnw -B verify -pl promotion-service -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-service-test-reports
          path: |
            promotion-service/target/surefire-reports/
            promotion-service/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
