name: streaming-service CI

on:
  push:
    branches: [main]
    paths:
      - 'streaming-service/**'
      - 'pom.xml'
      - '.github/workflows/streaming-service-ci.yml'
  pull_request:
    paths:
      - 'streaming-service/**'
      - 'pom.xml'
      - '.github/workflows/streaming-service-ci.yml'

# Push mới lên cùng một branch sẽ huỷ lượt chạy đang dở.
concurrency:
  group: streaming-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Service vẫn kế thừa pom cha ở gốc repo, nên pom đó phải nằm trong local repo
      # trước khi build module con. -N chỉ cài đúng pom cha, không build module nào.
      - name: Install parent POM
        run: ./mvnw -B -q install -N

      - name: Build and test streaming-service
        run: ./mvnw -B verify -pl streaming-service -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-service-test-reports
          path: |
            streaming-service/target/surefire-reports/
            streaming-service/target/failsafe-reports/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      # Chỉ kiểm chứng image build được. Chưa push vì chưa cấu hình registry.
      - name: Build Docker image
        run: docker build -f streaming-service/Dockerfile -t novaplay/streaming-service:${{ github.sha }} .
