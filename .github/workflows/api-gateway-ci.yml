name: api-gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'
  pull_request:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'

# KHÔNG lọc theo 'pom.xml' như các workflow phía Maven: api-gateway không nằm trong <modules>
# của pom cha, sửa pom đó không ảnh hưởng gì tới build này.

# Push mới lên cùng một branch sẽ huỷ lượt chạy đang dở.
concurrency:
  group: api-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Build Gradle ĐỘC LẬP: wrapper riêng, settings.gradle riêng, không kế thừa pom cha.
    # Mọi lệnh phải chạy từ trong thư mục service.
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - uses: actions/checkout@v4

      # JDK 25, KHÔNG phải 21 như phía Maven: build.gradle khai
      # toolchain JavaLanguageVersion.of(25).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # Không có bước "Install parent POM": service này không kế thừa pom nào.
      - name: Build and test api-gateway
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-test-reports
          # Đường dẫn của upload-artifact tính từ gốc workspace, không theo working-directory.
          path: |
            api-gateway/build/reports/tests/test/
            api-gateway/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      # Build context là THƯ MỤC SERVICE, không phải gốc repo như phía Maven: Dockerfile
      # COPY thẳng gradlew/settings.gradle/build.gradle theo đường dẫn tương đối, và
      # api-gateway/.dockerignore mới là file được áp dụng.
      # Chỉ kiểm chứng image build được. Chưa push vì chưa cấu hình registry.
      - name: Build Docker image
        run: docker build -f api-gateway/Dockerfile -t novaplay/api-gateway:${{ github.sha }} api-gateway
