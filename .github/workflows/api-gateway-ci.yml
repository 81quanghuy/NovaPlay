name: api-gateway CI

# api-gateway là build Gradle ĐỘC LẬP, không nằm trong <modules> của pom.xml gốc và chạy trên nền
# tảng khác hẳn phía Maven (JDK 25 / Spring Boot 4.1 thay vì JDK 21 / 3.5). Vì thế path filter ở
# đây KHÔNG gồm 'pom.xml' — sửa pom gốc không ảnh hưởng gì tới service này.
on:
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'
  pull_request:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway-ci.yml'

concurrency:
  group: api-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # Chạy TRONG thư mục service: wrapper và settings.gradle nằm ở đó, không phải ở gốc repo.
      - name: Build and test
        working-directory: api-gateway
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-test-reports
          path: api-gateway/build/reports/tests/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      # contents: write (không phải read) — bước cuối commit tag đã ghim ngược lại repo.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context là chính thư mục service, KHÁC với phía Maven (context = gốc repo): Dockerfile
      # của api-gateway chỉ COPY từ trong thư mục đó. Đây cũng là lý do api-gateway/.dockerignore
      # phải tồn tại riêng — file ở gốc repo không có hiệu lực với context này.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: api-gateway
          file: api-gateway/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/81nhuquynh/api-gateway:${{ github.sha }}
            ghcr.io/81nhuquynh/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ghim tag SHA vừa push vào overlay prod và commit ngược lại repo. Đây là mắt xích biến
      # "image đã có trên registry" thành "cluster biết phải chạy bản nào" — và cũng chính là chỗ
      # ArgoCD sau này cắm vào mà không phải sửa gì.
      #
      # 9 workflow có thể chạy song song và cùng commit vào main, nên phải rebase-retry: không có
      # vòng lặp này thì hai service merge cùng lúc sẽ có một bên fail với non-fast-forward.
      - name: Pin image tag in prod overlay
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # Cài vào RUNNER_TEMP thay vì /usr/local/bin: không phụ thuộc quyền ghi vào thư mục
          # hệ thống của runner, và tự biến mất cùng job.
          KUSTOMIZE_DIR="$RUNNER_TEMP/kustomize"
          mkdir -p "$KUSTOMIZE_DIR"
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | tar -xz -C "$KUSTOMIZE_DIR"
          export PATH="$KUSTOMIZE_DIR:$PATH"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            (cd k8s/overlays/prod && kustomize edit set image \
              ghcr.io/81nhuquynh/api-gateway=ghcr.io/81nhuquynh/api-gateway:${{ github.sha }})

            if git diff --quiet; then
              echo "Tag đã đúng, không có gì để commit."
              exit 0
            fi

            git add k8s/overlays/prod/kustomization.yaml
            git commit -m "ci(api-gateway): pin image to ${{ github.sha }} [skip ci]"

            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Đã ghim tag ở lần thử $attempt."
              exit 0
            fi
            echo "Push bị từ chối (có commit mới), thử lại lần $((attempt + 1))..."
            sleep $((attempt * 3))
          done

          echo "::error::Không ghim được tag sau 5 lần thử."
          exit 1
