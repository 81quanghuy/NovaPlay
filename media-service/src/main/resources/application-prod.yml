# Cấu hình production. Mọi giá trị nhạy cảm và phụ thuộc môi trường đều đến từ biến môi
# trường — không có credential nào được commit vào file này.
#
# Biến bắt buộc: MONGODB_URI, KAFKA_BOOTSTRAP_SERVERS, AWS_REGION, AWS_S3_BUCKET_NAME,
# AWS_SQS_QUEUE_NAME, CDN_BASE_URL, GATEWAY_SHARED_SECRET
#
# Biến cho storage provider thay thế (chỉ thực sự bắt buộc khi cờ media-storage-provider được
# flip sang provider tương ứng — xem StorageProviderResolver; khai báo sẵn để đổi cờ không cần
# redeploy):
#   Cloudflare R2: R2_ACCOUNT_ID, R2_BUCKET_NAME, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#                  R2_CDN_BASE_URL
#   Backblaze B2:  B2_REGION, B2_ENDPOINT, B2_BUCKET_NAME, B2_CDN_BASE_URL, B2_KEY_ID,
#                  B2_APPLICATION_KEY
#   config-service (nguồn cờ, đọc từ MongoDB — sửa giá trị bằng mongo-express/mongosh, không
#   redeploy): CONFIG_SERVICE_URI (mặc định trỏ Service DNS "http://config-service:8500")
spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
      # MongoIndexInitializer vẫn kiểm tra lại lúc khởi động vì auto-index-creation chạy lazy
      # theo từng entity và nuốt lỗi im lặng.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    # --- Kết nối Kafka managed (Aiven) -------------------------------------------------------
    # Mặc định giữ NGUYÊN hành vi cũ (PLAINTEXT, không SASL) để Kafka in-cluster, docker-compose
    # và Testcontainers trong CI không phải đổi gì. Aiven bật bằng 3 biến môi trường:
    # KAFKA_SECURITY_PROTOCOL=SASL_SSL, KAFKA_SASL_USERNAME, KAFKA_SASL_PASSWORD.
    #
    # CA LÀ BẮT BUỘC, không phải tuỳ chọn: chứng chỉ broker của Aiven do CA riêng của từng
    # project ký, JVM không tin sẵn — thiếu nó lỗi là SSLHandshakeException lúc bắt tay chứ
    # không phải "sai mật khẩu", rất dễ chẩn đoán nhầm. File PEM được Kafka client nạp thẳng
    # (ssl.truststore.type=PEM, hỗ trợ từ client 2.7), KHÔNG cần dựng JKS bằng keytool.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    ssl:
      trust-store-type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
      # Default trỏ tới đường dẫn mount trong Pod. File không tồn tại cũng vô hại khi protocol
      # là PLAINTEXT: Spring chỉ đổi Resource thành absolute path lúc dựng config, không mở file;
      # chỉ SSL channel builder mới thật sự đọc.
      trust-store-location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:file:/etc/novaplay/kafka/ca.pem}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      # Username/password tách riêng thành 2 biến thay vì dán nguyên chuỗi JAAS vào env: chuỗi
      # JAAS có dấu cách, mà apply-dev-secrets.sh dựng tham số kubectl theo dòng — giá trị có
      # dấu cách sẽ bị tách thành nhiều tham số và Secret ra sai.
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:}" password="${KAFKA_SASL_PASSWORD:}";'
    admin:
      # Đặt false trên Aiven free tier. Quota free là 5 topic x 2 partition, trong khi các
      # NewTopic bean của repo khai báo 11 topic (kể cả .DLT) phần lớn 3 partition -> KafkaAdmin
      # sẽ ném lỗi tạo topic ở MỖI lần khởi động service. Topic tạo tay trong Aiven Console,
      # danh sách chính xác nằm ở k8s/infra/README.md.
      auto-create: ${KAFKA_ADMIN_AUTO_CREATE:true}
  lifecycle:
    # Cho request đang chạy kịp hoàn tất trước khi tiến trình dừng hẳn.
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

aws:
  region: ${AWS_REGION}
  sqs:
    # Tắt khi storage KHÔNG phải AWS S3 thật: R2/B2/MinIO không phát event S3 nào vào SQS, nên
    # consumer chỉ là một kết nối AWS thừa (và là kết nối duy nhất còn cần credential AWS thật).
    # Xem S3UploadEventListener — bean chỉ tồn tại khi cờ này true.
    enabled: ${AWS_SQS_ENABLED:true}
    queue-name: ${AWS_SQS_QUEUE_NAME:unused}

storage:
  providers:
    aws-s3:
      # Không có "endpoint" ở đây — vắng mặt nghĩa là S3Client/S3Presigner trỏ thẳng vào AWS thật
      # (không override endpoint), dùng DefaultCredentialsProvider (IAM role), giữ đúng hành vi
      # AwsConfig cũ ở prod.
      region: ${AWS_REGION}
      bucket-name: ${AWS_S3_BUCKET_NAME}
      cdn-base-url: ${CDN_BASE_URL}
      force-path-style: false
      presigned-url-duration-minutes: ${PRESIGNED_URL_DURATION_MINUTES:15}
    cloudflare-r2:
      region: auto
      endpoint: https://${R2_ACCOUNT_ID:}.r2.cloudflarestorage.com
      bucket-name: ${R2_BUCKET_NAME:}
      cdn-base-url: ${R2_CDN_BASE_URL:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      force-path-style: true
      presigned-url-duration-minutes: ${PRESIGNED_URL_DURATION_MINUTES:15}
    # backblaze-b2 CHƯA dùng, nhưng StorageClientConfig dựng client cho CẢ BA provider ngay lúc
    # khởi động (map EnumMap, xem class đó), nên để trống là chết context:
    #   Region.of("")            -> IllegalArgumentException: region must not be blank or empty
    #   AwsBasicCredentials("")  -> "Access key ID cannot be blank" (trimToNull rồi validate)
    # Vì thế phải có giá trị placeholder khác rỗng. Client này không bao giờ được gọi tới chừng
    # nào cờ media-storage-provider chưa trỏ vào b2.
    #
    # Cách sửa gọn hơn (chưa làm vì cần đụng Java ở 3 service): cho StorageClientConfig BỎ QUA
    # provider chưa cấu hình thay vì dựng client mù.
    backblaze-b2:
      region: ${B2_REGION:us-west-004}
      endpoint: ${B2_ENDPOINT:}
      bucket-name: ${B2_BUCKET_NAME:}
      cdn-base-url: ${B2_CDN_BASE_URL:}
      access-key-id: ${B2_KEY_ID:unused-placeholder}
      secret-access-key: ${B2_APPLICATION_KEY:unused-placeholder}
      force-path-style: true
      presigned-url-duration-minutes: ${PRESIGNED_URL_DURATION_MINUTES:15}

feature-flags:
  provider: config-service
  default-storage-provider: ${DEFAULT_STORAGE_PROVIDER:aws-s3}

services:
  config: ${CONFIG_SERVICE_URI:http://config-service:8500}

feign:
  client:
    config:
      config-service:
        connect-timeout: 1000
        read-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      configService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

application:
  security:
    gateway-secret:
      # Bắt buộc bật ở production: nếu không, bất kỳ ai chạm được tới cổng service đều mạo danh
      # được người dùng bất kỳ bằng cách tự đặt header X-User-Email.
      enabled: true
      value: ${GATEWAY_SHARED_SECRET}

job:
  cleanup:
    pending-older-than-hours: ${CLEANUP_PENDING_HOURS:1}
    fail-older-than-hours: ${CLEANUP_FAIL_HOURS:24}
    fixed-rate-ms: ${CLEANUP_FIXED_RATE_MS:3600000}
    transcode-stuck-after-minutes: ${CLEANUP_TRANSCODE_STUCK_MINUTES:120}
    transcode-max-attempts: ${CLEANUP_TRANSCODE_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo,mongoIndex
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      # Lấy mẫu toàn bộ ở production quá tốn kém cả về chi phí lẫn độ trễ.
      probability: ${TRACING_SAMPLE_RATE:0.1}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: INFO
