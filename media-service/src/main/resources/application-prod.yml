# Cấu hình production. Mọi giá trị nhạy cảm và phụ thuộc môi trường đều đến từ biến môi
# trường — không có credential nào được commit vào file này.
#
# Biến bắt buộc: MONGODB_URI, KAFKA_BOOTSTRAP_SERVERS, AWS_REGION, AWS_S3_BUCKET_NAME,
# AWS_SQS_QUEUE_NAME, CDN_BASE_URL, GATEWAY_SHARED_SECRET
#
# Biến cho storage provider thay thế (chỉ thực sự bắt buộc khi cờ media-storage-provider được
# flip sang provider tương ứng — xem StorageProviderResolver; khai báo sẵn để đổi cờ không cần
# redeploy):
#   Cloudflare R2: R2_ACCOUNT_ID, R2_BUCKET_NAME, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#                  R2_CDN_BASE_URL
#   Backblaze B2:  B2_REGION, B2_ENDPOINT, B2_BUCKET_NAME, B2_CDN_BASE_URL, B2_KEY_ID,
#                  B2_APPLICATION_KEY
#   config-service (nguồn cờ, đọc từ MongoDB — sửa giá trị bằng mongo-express/mongosh, không
#   redeploy): CONFIG_SERVICE_URI (mặc định trỏ Service DNS "http://config-service:8500")
spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
      # MongoIndexInitializer vẫn kiểm tra lại lúc khởi động vì auto-index-creation chạy lazy
      # theo từng entity và nuốt lỗi im lặng.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  lifecycle:
    # Cho request đang chạy kịp hoàn tất trước khi tiến trình dừng hẳn.
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

aws:
  region: ${AWS_REGION}
  sqs:
    enabled: true
    queue-name: ${AWS_SQS_QUEUE_NAME}

storage:
  providers:
    aws-s3:
      # Không có "endpoint" ở đây — vắng mặt nghĩa là S3Client/S3Presigner trỏ thẳng vào AWS thật
      # (không override endpoint), dùng DefaultCredentialsProvider (IAM role), giữ đúng hành vi
      # AwsConfig cũ ở prod.
      region: ${AWS_REGION}
      bucket-name: ${AWS_S3_BUCKET_NAME}
      cdn-base-url: ${CDN_BASE_URL}
      force-path-style: false
      presigned-url-duration-minutes: ${PRESIGNED_URL_DURATION_MINUTES:15}
    cloudflare-r2:
      region: auto
      endpoint: https://${R2_ACCOUNT_ID:}.r2.cloudflarestorage.com
      bucket-name: ${R2_BUCKET_NAME:}
      cdn-base-url: ${R2_CDN_BASE_URL:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      force-path-style: true
      presigned-url-duration-minutes: ${PRESIGNED_URL_DURATION_MINUTES:15}
    backblaze-b2:
      region: ${B2_REGION:}
      endpoint: ${B2_ENDPOINT:}
      bucket-name: ${B2_BUCKET_NAME:}
      cdn-base-url: ${B2_CDN_BASE_URL:}
      access-key-id: ${B2_KEY_ID:}
      secret-access-key: ${B2_APPLICATION_KEY:}
      force-path-style: true
      presigned-url-duration-minutes: ${PRESIGNED_URL_DURATION_MINUTES:15}

feature-flags:
  provider: config-service
  default-storage-provider: ${DEFAULT_STORAGE_PROVIDER:aws-s3}

services:
  config: ${CONFIG_SERVICE_URI:http://config-service:8500}

feign:
  client:
    config:
      config-service:
        connect-timeout: 1000
        read-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      configService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

application:
  security:
    gateway-secret:
      # Bắt buộc bật ở production: nếu không, bất kỳ ai chạm được tới cổng service đều mạo danh
      # được người dùng bất kỳ bằng cách tự đặt header X-User-Email.
      enabled: true
      value: ${GATEWAY_SHARED_SECRET}

job:
  cleanup:
    pending-older-than-hours: ${CLEANUP_PENDING_HOURS:1}
    fail-older-than-hours: ${CLEANUP_FAIL_HOURS:24}
    fixed-rate-ms: ${CLEANUP_FIXED_RATE_MS:3600000}
    transcode-stuck-after-minutes: ${CLEANUP_TRANSCODE_STUCK_MINUTES:120}
    transcode-max-attempts: ${CLEANUP_TRANSCODE_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo,mongoIndex
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      # Lấy mẫu toàn bộ ở production quá tốn kém cả về chi phí lẫn độ trễ.
      probability: ${TRACING_SAMPLE_RATE:0.1}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: INFO
