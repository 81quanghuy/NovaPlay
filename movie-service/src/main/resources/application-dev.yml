spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017/movie_service
      # Bắt buộc, nếu không các unique index mà logic chống trùng slug/tên thể loại dựa vào
      # sẽ không tồn tại.
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      timeout: 5s

server:
  port: 8600
  shutdown: graceful

application:
  security:
    gateway-secret:
      # Tắt ở local để gọi thẳng service khi dev; PROD bắt buộc bật.
      enabled: false
  cache:
    # TTL ngắn ở dev để thấy ngay thay đổi mà không phải xoá cache tay.
    movie-detail-ttl: 1m
    genre-list-ttl: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo,redis,mongoIndex
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: DEBUG
