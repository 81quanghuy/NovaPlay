# Cấu hình production. Mọi giá trị nhạy cảm và phụ thuộc môi trường đều đến từ biến môi
# trường — không có credential nào được commit vào file này.
#
# Biến bắt buộc: MONGODB_URI, REDIS_HOST, GATEWAY_SHARED_SECRET
spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
      # MongoIndexInitializer vẫn kiểm tra lại lúc khởi động vì auto-index-creation chạy lazy
      # theo từng entity và nuốt lỗi im lặng.
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Default false: Redis in-cluster (Bitnami) chạy plaintext. Redis cloud (Upstash) BẮT
      # BUỘC TLS → đặt REDIS_SSL_ENABLED=true (Tiltfile tự inject khi use_cloud_redis).
      # Thiếu khối này thì biến môi trường bị Spring bỏ qua trong im lặng, client nối plaintext
      # vào cổng TLS và lỗi hiện ra là "Connection closed prematurely" — trông hệt như mạng lỗi
      # hoặc sai host, chứ không hề nhắc tới TLS.
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  lifecycle:
    # Cho request đang chạy kịp hoàn tất trước khi tiến trình dừng hẳn.
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8600}
  shutdown: graceful

application:
  security:
    gateway-secret:
      # Bắt buộc bật ở production: nếu không, bất kỳ ai chạm được tới cổng service đều mạo danh
      # được ADMIN bằng cách tự đặt header X-User-Roles và ghi đè cả catalog.
      enabled: true
      value: ${GATEWAY_SHARED_SECRET}
  cache:
    movie-detail-ttl: ${CACHE_MOVIE_DETAIL_TTL:10m}
    genre-list-ttl: ${CACHE_GENRE_LIST_TTL:1h}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Pod mất kết nối datastore hoặc thiếu unique index không được nhận traffic: thiếu index
        # nghĩa là ràng buộc chống trùng slug không còn hiệu lực.
        readiness:
          include: readinessState,mongo,redis,mongoIndex
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      # Lấy mẫu toàn bộ ở production quá tốn kém cả về chi phí lẫn độ trễ.
      probability: ${TRACING_SAMPLE_RATE:0.1}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: INFO
