spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/promotion_service
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8300

application:
  security:
    gateway-secret:
      # Tắt ở local để gọi thẳng service khi dev; PROD bắt buộc bật.
      enabled: false
      value: ""

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: DEBUG

novaplay:
  outbox:
    # Đường CHÍNH: sau khi transaction COMMIT thì đẩy thẳng id sang relay trong cùng JVM.
    relay-after-commit: ${OUTBOX_RELAY_AFTER_COMMIT:true}
    # LƯỚI AN TOÀN: quét bù row mà pod chết bỏ lại giữa COMMIT và relay. Không phải đường chính
    # nên chu kỳ để thưa — kéo ngắn lại không làm event tới nhanh hơn, chỉ tốn thêm query.
    sweep-enabled: ${OUTBOX_SWEEP_ENABLED:true}
    sweep-interval: ${OUTBOX_SWEEP_INTERVAL:60s}
    # LISTEN/NOTIFY: chỉ bật khi DATASOURCE_URL trỏ THẲNG tới Postgres. Qua connection pooler
    # (Supavisor của Supabase, PgBouncer) sẽ lặp vô hạn lỗi "Unknown Response Type S".
    listen-enabled: ${OUTBOX_LISTEN_ENABLED:false}
