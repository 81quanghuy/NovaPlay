spring:
  config:
    activate:
      on-profile: dev
  liquibase:
    # Bật ở cả dev lẫn prod: schema chỉ có MỘT nguồn sự thật là db/changelog/. Đây cũng là cách
    # duy nhất để dev có function outbox_notify() và trigger outbox_notify_trg — chúng không phải
    # entity JPA nên ddl-auto=update không bao giờ tạo ra chúng, và thiếu chúng thì outbox chỉ
    # chảy mỗi khi có lượt poll/catch-up.
    enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/promotion_service
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # validate chứ không phải update: Liquibase đã dựng schema, để Hibernate sửa thêm sẽ tạo
      # lệch âm thầm giữa DB dev và changelog — đúng thứ khiến prod fail lúc validate.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8300

application:
  security:
    gateway-secret:
      # Tắt ở local để gọi thẳng service khi dev; PROD bắt buộc bật.
      enabled: false
      value: ""

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    vn.iotstar: DEBUG
