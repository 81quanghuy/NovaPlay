# Loki single-binary cho dev/QA trên k8s — bản rút gọn so với kiểu microservice + MinIO của
# docker-compose (xem docker-compose/observability/loki/loki-config.yaml), lưu filesystem thay vì
# object storage, đủ để xem log ở local. Nguồn: k8s/infra/README.md (mục Monitoring) cũ.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  persistence:
    enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
gateway:
  enabled: false
test:
  enabled: false
