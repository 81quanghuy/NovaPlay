# Mailhog 1-pod cho dev/QA — mirror service "mailhog" của docker-compose/qa/docker-compose.yml.
# notification-service (profile "prod" trên k8s) mặc định trỏ SMTP tới smtp.gmail.com qua
# configmap.yaml đã commit; Tiltfile ghi đè MAIL_HOST/MAIL_PORT trên Deployment (không sửa file
# đã commit) để trỏ về Service này khi chạy qua Tilt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  labels:
    app: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:latest
          ports:
            - name: smtp
              containerPort: 1025
            - name: web
              containerPort: 8025
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  labels:
    app: mailhog
spec:
  type: ClusterIP
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: web
      port: 8025
      targetPort: web
