# MẪU — KHÔNG commit giá trị thật.
#
# Tạo secret thật bằng lệnh (hoặc bằng công cụ quản lý secret của bạn):
#
#   kubectl create secret generic user-service-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo-0,mongo-1,mongo-2/user_service?replicaSet=rs0&tls=true' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=GATEWAY_SHARED_SECRET='...'
#
# Lưu ý:
# - MONGODB_URI PHẢI trỏ tới một replica set: MongoDB chỉ hỗ trợ transaction trên replica set,
#   và application-prod.yml bật application.mongodb.transactions-enabled=true.
# - GATEWAY_SHARED_SECRET phải TRÙNG KHỚP với giá trị cấu hình ở api-gateway. Lệch giá trị
#   sẽ khiến mọi request bị trả 403, nên hai bên phải được cập nhật cùng lúc.
#
# Kafka managed (Aiven) — chỉ cần khi KAFKA_SECURITY_PROTOCOL=SASL_SSL:
# - KAFKA_SASL_USERNAME/KAFKA_SASL_PASSWORD: user SASL của service Kafka (free tier chỉ có
#   "avnadmin"). Hai giá trị này ghép thành sasl.jaas.config trong application-prod.yml.
# - CHÚNG KHÔNG ĐỦ MỘT MÌNH: còn cần Secret dùng chung "aiven-kafka-ca" (CA của project, mount
#   vào /etc/novaplay/kafka/ca.pem). Thiếu CA thì lỗi là SSLHandshakeException, KHÔNG phải lỗi
#   sai mật khẩu — xem k8s/infra/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secrets
  labels:
    app: user-service
type: Opaque
stringData:
  MONGODB_URI: ""
  REDIS_PASSWORD: ""
  GATEWAY_SHARED_SECRET: ""
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
