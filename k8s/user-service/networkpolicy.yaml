# Lớp phòng thủ thứ hai bổ trợ cho bí mật dùng chung X-Gateway-Auth.
#
# Service tin tưởng header X-User-Email để xác định danh tính người dùng. Bí mật dùng chung
# ngăn kẻ tấn công tự khai báo danh tính, còn policy này chặn luôn khả năng chúng chạm tới
# service ngay từ đầu. Cần cả hai: bí mật có thể bị lộ, còn network policy thì không giúp
# được gì nếu kẻ tấn công đã chiếm được một pod hợp lệ.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
    - Ingress
  ingress:
    # Traffic ứng dụng: chỉ đến từ gateway.
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8700
    # Prometheus thu thập số liệu, thường nằm ở namespace giám sát riêng.
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8700
