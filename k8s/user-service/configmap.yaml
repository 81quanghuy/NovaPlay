apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  labels:
    app: user-service
# Chỉ chứa giá trị không nhạy cảm. Credential nằm ở user-service-secrets.
data:
  # Chart Redis (standalone) tạo Service tên "redis-master", không phải "redis".
  REDIS_HOST: "redis-master"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  MEDIA_SERVICE_URI: "http://media-service:8081"
  SERVER_PORT: "8700"
  # Lấy mẫu toàn bộ ở production quá tốn kém; 10% đủ để phát hiện xu hướng.
  TRACING_SAMPLE_RATE: "0.1"
