apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  # ClusterIP chứ không phải LoadBalancer/NodePort: service này chỉ được tiếp cận qua
  # api-gateway. Expose ra ngoài sẽ mở đường đi vòng qua lớp xác thực của gateway.
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8700
      targetPort: http
