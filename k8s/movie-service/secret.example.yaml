# MẪU — KHÔNG commit giá trị thật.
#
# Tạo secret thật bằng lệnh (hoặc bằng công cụ quản lý secret của bạn):
#
#   kubectl create secret generic movie-service-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo-0,mongo-1,mongo-2/movie_service?replicaSet=rs0&tls=true' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=GATEWAY_SHARED_SECRET='...'
#
# Lưu ý:
# - GATEWAY_SHARED_SECRET phải TRÙNG KHỚP với giá trị cấu hình ở api-gateway. Lệch giá trị sẽ
#   khiến MỌI request bị trả 403, kể cả request duyệt catalog công khai — gateway gắn header này
#   cho cả traffic ẩn danh, vì nó chứng minh "đã đi qua gateway" chứ không phải "đã đăng nhập".
#   Hai bên phải được cập nhật cùng lúc.
# - Khác user-service, movie-service KHÔNG bắt buộc replica set: nó không dùng transaction.
#   Dù vậy production vẫn nên chạy replica set để có khả năng chịu lỗi.
apiVersion: v1
kind: Secret
metadata:
  name: movie-service-secrets
  labels:
    app: movie-service
type: Opaque
stringData:
  MONGODB_URI: ""
  REDIS_PASSWORD: ""
  GATEWAY_SHARED_SECRET: ""
