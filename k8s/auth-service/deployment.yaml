apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: auth-service
          image: ghcr.io/81nhuquynh/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/libs/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: auth-service
            # Gửi trace về Tempo (namespace monitoring). Tempo CHỈ nhận traces nên tắt
            # OTLP metrics/logs — metrics do Prometheus scrape /actuator/prometheus, logs do
            # Alloy→Loki. Nếu CHƯA deploy monitoring, đổi endpoint hoặc đặt OTEL_SDK_DISABLED=true.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc:4318
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Keypair RSA đến từ Secret mount ở dưới, KHÔNG từ classpath trong image.
            # Không có hai biến này, application-prod.yml rơi về classpath:keys/*.pem nghĩa là
            # private key nằm trong layer image — xem chú thích ở application-prod.yml.
            - name: PRIVATE_KEY_PATH
              value: file:/etc/novaplay/keys/private.pem
            - name: PUBLIC_KEY_PATH
              value: file:/etc/novaplay/keys/public.pem
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-keys
              mountPath: /etc/novaplay/keys
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Private key ký JWT. defaultMode 0400: chỉ user chạy tiến trình đọc được, không ai ghi.
        # Secret này do kubeseal sinh (k8s/auth-service/sealedsecret.yaml) và TÁCH RIÊNG khỏi
        # auth-service-secrets: credential DB có thể xoay vòng thoải mái, còn đổi keypair thì
        # phải đồng bộ cùng lúc với api-gateway nếu không mọi token đang lưu hành đều hỏng.
        - name: jwt-keys
          secret:
            secretName: auth-service-jwt-keys
            defaultMode: 0400
