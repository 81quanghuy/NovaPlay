# MẪU — KHÔNG commit giá trị thật.
#
# Tạo secret thật bằng lệnh (hoặc bằng công cụ quản lý secret của bạn):
#
#   kubectl create secret generic auth-service-secrets \
#     --from-literal=DATASOURCE_USERNAME='...' \
#     --from-literal=DATASOURCE_PASSWORD='...' \
#     --from-literal=REDIS_PASSWORD='...'
#
# Kafka managed (Aiven) — chỉ cần khi KAFKA_SECURITY_PROTOCOL=SASL_SSL:
# - KAFKA_SASL_USERNAME/KAFKA_SASL_PASSWORD: user SASL của service Kafka (free tier chỉ có
#   "avnadmin"). Hai giá trị này ghép thành sasl.jaas.config trong application-prod.yml.
# - CHÚNG KHÔNG ĐỦ MỘT MÌNH: còn cần Secret dùng chung "aiven-kafka-ca" (CA của project, mount
#   vào /etc/novaplay/kafka/ca.pem). Thiếu CA thì lỗi là SSLHandshakeException, KHÔNG phải lỗi
#   sai mật khẩu — xem k8s/infra/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  labels:
    app: auth-service
type: Opaque
stringData:
  DATASOURCE_USERNAME: ""
  DATASOURCE_PASSWORD: ""
  REDIS_PASSWORD: ""
  # Phải trùng giá trị của api-gateway; auth-service fail-fast lúc khởi động nếu thiếu.
  GATEWAY_SHARED_SECRET: ""
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
---
# MẪU thứ hai — keypair RSA ký JWT. Tách riêng khỏi auth-service-secrets có chủ đích:
# credential DB xoay vòng độc lập được, còn đổi keypair thì phải đồng bộ CÙNG LÚC với
# api-gateway-jwt-public-key, nếu không mọi token đang lưu hành đều hỏng.
#
# Dev: apply-dev-secrets.sh tự tạo từ auth-service/src/main/resources/keys/*.pem.
# Prod: sinh bằng kubeseal rồi commit SealedSecret, KHÔNG tạo tay bằng lệnh dưới đây.
#
#   kubectl create secret generic auth-service-jwt-keys \
#     --from-file=private.pem=private.pem \
#     --from-file=public.pem=public.pem
#
# Sinh cặp key mới (private key PHẢI ở dạng PKCS#8, đúng cái AuthServiceKeyConfig đang parse):
#
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl rsa -pubout -in private.pem -out public.pem
#
# BACKUP private.pem ra ngoài cluster. Mất nó nghĩa là phải sinh keypair mới, và mọi refresh
# token đang lưu hành đều trở nên vô hiệu — toàn bộ người dùng bị đăng xuất.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-jwt-keys
  labels:
    app: auth-service
type: Opaque
stringData:
  private.pem: ""
  public.pem: ""
