# MẪU — KHÔNG commit giá trị thật.
#
#   kubectl create secret generic streaming-service-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo-0,mongo-1,mongo-2/streaming_service?replicaSet=rs0&tls=true' \
#     --from-literal=REDIS_HOST='redis-master' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=MOVIE_SERVICE_URI='http://movie-service:8600' \
#     --from-literal=MEDIA_SERVICE_URI='http://media-service:8081' \
#     --from-literal=GATEWAY_SHARED_SECRET='...' \
#     --from-literal=PLAYBACK_TOKEN_SECRET='<base64, 32 byte ngẫu nhiên>' \
#     --from-literal=TRANSCODE_KEY_WRAP_SECRET='<base64, 32 byte ngẫu nhiên>'
#
# Lưu ý:
# - GATEWAY_SHARED_SECRET phải TRÙNG KHỚP với api-gateway.
# - TRANSCODE_KEY_WRAP_SECRET phải TRÙNG KHỚP với transcoding-worker's secret cùng tên — đây là
#   khoá dùng để mở lại khoá AES-128 mà worker đã bọc khi mã hoá segment HLS. Lệch giá trị nghĩa
#   là mọi video đã transcode trước đó không phát lại được, phải transcode lại từ đầu.
# - PLAYBACK_TOKEN_SECRET chỉ streaming-service dùng (mint + validate) — không chia sẻ với service
#   nào khác.
# - KHÔNG có access key/secret key AWS ở đây: production dùng IRSA, xem media-service's
#   secret.example.yaml.
# - R2_* : provider đang dùng thật là Cloudflare R2, nên bốn biến này BẮT BUỘC. Chúng phải trùng
#   khít với media-service và transcoding-worker (cùng account, cùng bucket): media ký URL upload,
#   worker ghi HLS output, service này đọc segment ra — lệch bucket là playback 404 dù transcode
#   đã báo xong, và không có log lỗi nào ở giữa.
#   B2_* (Backblaze) vẫn CỐ Ý vắng mặt: application-prod.yml có khai báo provider đó nhưng chưa
#   dùng tới. Chỉ thêm khi thật sự chuyển sang B2.
apiVersion: v1
kind: Secret
metadata:
  name: streaming-service-secrets
  labels:
    app: streaming-service
type: Opaque
stringData:
  MONGODB_URI: ""
  REDIS_HOST: ""
  REDIS_PASSWORD: ""
  MOVIE_SERVICE_URI: ""
  MEDIA_SERVICE_URI: ""
  GATEWAY_SHARED_SECRET: ""
  PLAYBACK_TOKEN_SECRET: ""
  TRANSCODE_KEY_WRAP_SECRET: ""
  R2_ACCOUNT_ID: ""
  R2_BUCKET_NAME: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
