# Lớp phòng thủ thứ hai bổ trợ cho bí mật dùng chung X-Gateway-Auth — xem media-service's
# networkpolicy.yaml cho lý do cần cả hai lớp.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: streaming-service
  labels:
    app: streaming-service
spec:
  podSelector:
    matchLabels:
      app: streaming-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8200
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8200
