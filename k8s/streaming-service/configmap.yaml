apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-service-config
  labels:
    app: streaming-service
# Chỉ chứa giá trị không nhạy cảm. Credential nằm ở streaming-service-secrets.
data:
  SERVER_PORT: "8200"
  TRACING_SAMPLE_RATE: "0.1"
  AWS_REGION: "us-east-1"
  # Cùng bucket với media-service/transcoding-worker — nơi worker đã ghi output HLS vào.
  AWS_S3_BUCKET_NAME: "novaplay-media"
  SEGMENT_URL_DURATION_MINUTES: "360"
  PLAYBACK_TOKEN_TTL_HOURS: "4"
  VIEW_DEDUP_WINDOW_MINUTES: "30"
  # Rỗng = chưa gắn CDN, cờ streaming-delivery-mode=cloudfront tự rơi về presigned URL — xem
  # SegmentUrlResolver. Điền domain CloudFront distribution khi hạ tầng CDN đã sẵn sàng.
  VIDEO_CDN_BASE_URL: ""
  # CONFIG_SERVICE_URI không cần khai báo ở đây: default "http://config-service:8500" trong
  # application-prod.yml đã đúng Service DNS name trong cụm — cùng convention với media-service.
  # Trần connection Mongo MỖI POD. Giá trị ở đây ghi đè default trong application-prod.yml
  # (envFrom: configMap đứng trước secret, cả hai đều thắng giá trị mặc định trong yml) — sửa
  # trần thì phải sửa ở ĐÂY, đổi mỗi file yml sẽ không có tác dụng gì trên cluster.
  #
  # 10 x maxReplicas 4 = 40 connection. Prod dùng Atlas M0 với trần ~500 dùng CHUNG cho cả 6
  # service chạm Mongo, nên đây không phải con số tuỳ ý: nới nó mà quên nhân với maxReplicas là
  # làm cả cụm mất kết nối Mongo khi có tải, không riêng service này.
  MONGO_MAX_POOL_SIZE: "10"
