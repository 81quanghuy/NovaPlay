# MẪU — KHÔNG commit giá trị thật.
#
# Tạo secret thật bằng lệnh (hoặc bằng công cụ quản lý secret của bạn):
#
#   kubectl create secret generic media-service-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo-0,mongo-1,mongo-2/media_service?replicaSet=rs0&tls=true' \
#     --from-literal=KAFKA_BOOTSTRAP_SERVERS='kafka-0:9092,kafka-1:9092,kafka-2:9092' \
#     --from-literal=AWS_SQS_QUEUE_NAME='media-upload-events' \
#     --from-literal=GATEWAY_SHARED_SECRET='...'
#
# Lưu ý:
# - GATEWAY_SHARED_SECRET phải TRÙNG KHỚP với giá trị cấu hình ở api-gateway. Lệch giá trị sẽ
#   khiến MỌI request bị trả 403, kể cả request đọc — service này không có endpoint công khai.
#   Hai bên phải được cập nhật cùng lúc.
# - KHÔNG có access key/secret key AWS ở đây: production dùng IRSA (IAM Role for Service
#   Account) để cấp quyền truy cập S3/SQS cho pod — AwsConfig dùng DefaultCredentialsProvider,
#   tự động lấy credential tạm thời qua service account token, không cần biến môi trường nào.
#   Chỉ dev/QA (docker-compose, chạy MinIO local) mới cần AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
#
# Kafka managed (Aiven) — chỉ cần khi KAFKA_SECURITY_PROTOCOL=SASL_SSL:
# - KAFKA_SASL_USERNAME/KAFKA_SASL_PASSWORD: user SASL của service Kafka (free tier chỉ có
#   "avnadmin"). Hai giá trị này ghép thành sasl.jaas.config trong application-prod.yml.
# - CHÚNG KHÔNG ĐỦ MỘT MÌNH: còn cần Secret dùng chung "aiven-kafka-ca" (CA của project, mount
#   vào /etc/novaplay/kafka/ca.pem). Thiếu CA thì lỗi là SSLHandshakeException, KHÔNG phải lỗi
#   sai mật khẩu — xem k8s/infra/README.md.
#
# Cloudflare R2 — chỉ cần khi cờ media-storage-provider (hoặc DEFAULT_STORAGE_PROVIDER) là
# cloudflare-r2. CẢ BA service media/streaming/transcoding-worker phải dùng CÙNG R2_BUCKET_NAME
# và cùng R2_ACCOUNT_ID, nếu không playback trả 404 dù transcode đã xong.
apiVersion: v1
kind: Secret
metadata:
  name: media-service-secrets
  labels:
    app: media-service
type: Opaque
stringData:
  MONGODB_URI: ""
  KAFKA_BOOTSTRAP_SERVERS: ""
  AWS_SQS_QUEUE_NAME: ""
  GATEWAY_SHARED_SECRET: ""
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
  R2_ACCOUNT_ID: ""
  R2_BUCKET_NAME: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  R2_CDN_BASE_URL: ""
