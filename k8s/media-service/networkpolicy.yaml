# Lớp phòng thủ thứ hai bổ trợ cho bí mật dùng chung X-Gateway-Auth.
#
# Service tin tưởng header X-User-Email/X-User-Roles để quyết định ai sở hữu media nào. Bí mật
# dùng chung ngăn kẻ tấn công tự khai mình là người dùng bất kỳ, còn policy này chặn luôn khả
# năng chúng chạm tới service ngay từ đầu. Cần cả hai: bí mật có thể bị lộ, còn network policy
# thì không giúp được gì nếu kẻ tấn công đã chiếm được một pod hợp lệ.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-service
  labels:
    app: media-service
spec:
  podSelector:
    matchLabels:
      app: media-service
  policyTypes:
    - Ingress
  ingress:
    # Traffic ứng dụng. Bốn nguồn hợp lệ, KHÔNG chỉ mình gateway:
    #   - api-gateway: traffic của người dùng cuối (/api/v1/media/**).
    #   - streaming-service: Feign MediaServiceClient, resolve VideoManifest lúc dựng phiên phát.
    #   - transcoding-worker: Feign MediaServiceClient, báo manifest complete/fail sau khi ffmpeg
    #     xong. Worker báo về bằng Feign chứ không bằng Kafka, nên thiếu rule này thì MỌI video
    #     kẹt vĩnh viễn ở PROCESSING.
    #   - user-service: Feign MediaServiceClient, đọc media của chính người dùng.
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: streaming-service
        - podSelector:
            matchLabels:
              app: transcoding-worker
        - podSelector:
            matchLabels:
              app: user-service
      ports:
        - protocol: TCP
          port: 8081
    # Prometheus thu thập số liệu, thường nằm ở namespace giám sát riêng.
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8081
