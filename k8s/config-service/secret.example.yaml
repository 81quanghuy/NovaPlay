# MẪU — KHÔNG commit giá trị thật.
#
# Tạo secret thật bằng lệnh (hoặc bằng công cụ quản lý secret của bạn):
#
#   kubectl create secret generic config-service-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo-0,mongo-1,mongo-2/config_service?replicaSet=rs0&tls=true'
#
# config-service không trust X-User-Email/X-Gateway-Auth (không phục vụ traffic người dùng, chỉ
# gọi nội bộ) nên không cần GATEWAY_SHARED_SECRET như các service hướng người dùng khác — lớp bảo
# vệ duy nhất là NetworkPolicy (xem networkpolicy.yaml), giới hạn pod nào được phép gọi vào.
apiVersion: v1
kind: Secret
metadata:
  name: config-service-secrets
  labels:
    app: config-service
type: Opaque
stringData:
  MONGODB_URI: ""
