apiVersion: v1
kind: Service
metadata:
  name: config-service
  labels:
    app: config-service
spec:
  # ClusterIP: config-service không phục vụ traffic người dùng, chỉ được gọi service-to-service
  # nội bộ (vd media-service) — không đi qua api-gateway, không cần expose ra ngoài.
  type: ClusterIP
  selector:
    app: config-service
  ports:
    - name: http
      port: 8500
      targetPort: http
