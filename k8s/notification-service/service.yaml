apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  # ClusterIP chứ không phải LoadBalancer/NodePort: service này chỉ được tiếp cận qua
  # api-gateway. Expose ra ngoài sẽ mở đường đi vòng qua lớp xác thực của gateway — và ở đây
  # điều đó nghĩa là đọc được thông báo riêng của bất kỳ ai chỉ bằng một header tự đặt.
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8900
      targetPort: http
