apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8900"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Quan trọng hơn ở service này so với các service chỉ phục vụ HTTP: pod bị giết giữa
      # chừng khi đang xử lý một sự kiện sẽ khiến bản ghi đó được giao lại cho instance khác.
      # Cơ chế chống trùng theo từng kênh xử lý được điều đó, nhưng vẫn nên cho consumer kịp
      # commit offset thay vì phải dựa vào nó.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: notification-service
          image: ghcr.io/81nhuquynh/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8900
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # MDC traceId/spanId trong log chỉ có giá trị khi javaagent được gắn.
            # Dockerfile đặt agent tại đúng đường dẫn này.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/libs/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: notification-service
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Startup probe cho JVM thời gian khởi động mà không phải nới lỏng liveness.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          # Readiness gồm cả kiểm tra index của Mongo: thiếu index thì truy vấn danh sách
          # thông báo full-scan cả collection. Cố tình KHÔNG gồm Kafka — mất kết nối broker
          # không nên khiến pod ngừng phục vụ REST API đọc thông báo.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-ca
              mountPath: /etc/novaplay/kafka
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # CA của project Aiven, nguồn: k8s/infra/aiven-kafka-ca.pem (tải từ Aiven Console,
        # KHÔNG commit). optional: true để cụm chạy Kafka in-cluster/PLAINTEXT vẫn khởi động
        # bình thường khi chưa có Secret này — thiếu CA lúc bật SASL_SSL thì lỗi hiện ra ở bước
        # bắt tay TLS, không phải lúc tạo Pod.
        - name: kafka-ca
          secret:
            secretName: aiven-kafka-ca
            optional: true
            defaultMode: 0444
