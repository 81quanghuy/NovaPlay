# MẪU — KHÔNG commit giá trị thật.
#
# Tạo secret thật bằng lệnh (hoặc bằng công cụ quản lý secret của bạn):
#
#   kubectl create secret generic notification-service-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo-0,mongo-1,mongo-2/notification_service?replicaSet=rs0&tls=true' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=MAIL_USERNAME='ban@vidu.com' \
#     --from-literal=MAIL_PASSWORD='xsmtpsib-xxx' \
#     --from-literal=GATEWAY_SHARED_SECRET='...'
#
# Lưu ý:
# - GATEWAY_SHARED_SECRET phải TRÙNG KHỚP với giá trị cấu hình ở api-gateway. Lệch giá trị sẽ
#   khiến MỌI request bị trả 403. Hai bên phải được cập nhật cùng lúc.
# - MAIL_USERNAME là email ĐĂNG NHẬP tài khoản Brevo (app.brevo.com -> icon avatar -> "SMTP &
#   API" -> tab "SMTP", giá trị "Login" hiện sẵn, không tự đặt được) — không phải MAIL_FROM.
#   Địa chỉ From hiển thị nằm ở MAIL_FROM, đặt trong ConfigMap (không nhạy cảm).
# - MAIL_PASSWORD là "SMTP key" thật (cùng trang trên, nút "Generate a new SMTP key") — KHÔNG
#   phải "API key" ở tab "API Keys" cạnh đó, hai loại khác nhau. Brevo chỉ hiện giá trị đầy đủ
#   đúng 1 lần lúc tạo, phải copy ngay.
#
# Kafka managed (Aiven) — chỉ cần khi KAFKA_SECURITY_PROTOCOL=SASL_SSL:
# - KAFKA_SASL_USERNAME/KAFKA_SASL_PASSWORD: user SASL của service Kafka (free tier chỉ có
#   "avnadmin"). Hai giá trị này ghép thành sasl.jaas.config trong application-prod.yml.
# - CHÚNG KHÔNG ĐỦ MỘT MÌNH: còn cần Secret dùng chung "aiven-kafka-ca" (CA của project, mount
#   vào /etc/novaplay/kafka/ca.pem). Thiếu CA thì lỗi là SSLHandshakeException, KHÔNG phải lỗi
#   sai mật khẩu — xem k8s/infra/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  labels:
    app: notification-service
type: Opaque
stringData:
  MONGODB_URI: ""
  REDIS_PASSWORD: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  GATEWAY_SHARED_SECRET: ""
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
