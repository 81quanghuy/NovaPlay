# MẪU — KHÔNG commit giá trị thật.
#
# Tạo secret thật bằng lệnh (hoặc bằng công cụ quản lý secret của bạn):
#
#   kubectl create secret generic notification-service-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo-0,mongo-1,mongo-2/notification_service?replicaSet=rs0&tls=true' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=MAIL_USERNAME='no-reply@novaplay.vn' \
#     --from-literal=MAIL_PASSWORD='...' \
#     --from-literal=GATEWAY_SHARED_SECRET='...'
#
# Lưu ý:
# - GATEWAY_SHARED_SECRET phải TRÙNG KHỚP với giá trị cấu hình ở api-gateway. Lệch giá trị sẽ
#   khiến MỌI request bị trả 403. Hai bên phải được cập nhật cùng lúc.
# - MAIL_PASSWORD với Gmail phải là App Password, không phải mật khẩu tài khoản.
# - Không đặt MAIL_FROM ở đây trừ khi nó khác MAIL_USERNAME: mặc định đã là MAIL_USERNAME, và
#   nhiều máy chủ SMTP từ chối thư có From không khớp tài khoản đã xác thực.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  labels:
    app: notification-service
type: Opaque
stringData:
  MONGODB_URI: ""
  REDIS_PASSWORD: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  GATEWAY_SHARED_SECRET: ""
