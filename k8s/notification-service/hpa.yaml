# TRẦN ĐƯỢC TÍNH LẠI CHO CỤM k3s 1–2 VPS (~8 vCPU tổng, trừ đi Kafka + monitoring + k3s).
# Con số cũ (tới 10 pod) là trần lý thuyết không bao giờ đạt tới trên phần cứng này — HPA sẽ kẹt
# ở trạng thái muốn scale mà scheduler không có chỗ, pod nằm Pending vô hạn.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  # Trần CỨNG bằng số partition của các topic Kafka (3). Pod thứ 4 trở đi sẽ idle
  # vì không được gán partition nào. Muốn nới thì tăng partition TRƯỚC.
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Hạ quy mô từ từ: mỗi lần pod rời đi đều kích hoạt rebalance consumer group, làm dừng
      # tiêu thụ trong chốc lát.
      stabilizationWindowSeconds: 300
