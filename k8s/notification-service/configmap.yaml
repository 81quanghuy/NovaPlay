apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  labels:
    app: notification-service
# Chỉ chứa giá trị không nhạy cảm. Credential nằm ở notification-service-secrets.
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-services:29092"
  SERVER_PORT: "8900"
  # Lấy mẫu toàn bộ ở production quá tốn kém; 10% đủ để phát hiện xu hướng.
  TRACING_SAMPLE_RATE: "0.1"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  # Đường dẫn gốc của frontend, dùng để dựng link xác thực trong email. Sai giá trị này nghĩa
  # là mọi email OTP đều chứa link chết — không có lỗi nào báo ra, chỉ có người dùng không
  # xác thực được tài khoản.
  APP_FRONTEND_BASE_URL: "https://novaplay.vn"
