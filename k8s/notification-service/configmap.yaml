apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  labels:
    app: notification-service
# Chỉ chứa giá trị không nhạy cảm. Credential nằm ở notification-service-secrets.
data:
  # Chart Redis (standalone) tạo Service tên "redis-master", không phải "redis".
  REDIS_HOST: "redis-master"
  REDIS_PORT: "6379"
  # Chart Kafka (fullnameOverride: kafka) tạo Service tên "kafka", cổng client 9092 —
  # "kafka-services:29092" là tên/cổng nội bộ của docker-compose, không tồn tại trong cluster.
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SERVER_PORT: "8900"
  # Lấy mẫu toàn bộ ở production quá tốn kém; 10% đủ để phát hiện xu hướng.
  TRACING_SAMPLE_RATE: "0.1"
  MAIL_HOST: "smtp-relay.brevo.com"
  MAIL_PORT: "587"
  # Địa chỉ From hiển thị trên email — PHẢI đã verify (mục "Senders" trên app.brevo.com) trước,
  # nếu không Brevo từ chối gửi ở tầng API chứ không phải lỗi ở service. Không nhạy cảm (không
  # phải credential) nên nằm ở ConfigMap chứ không phải Secret.
  MAIL_FROM: "ngoquanghuy0310@gmail.com"
  # Đường dẫn gốc của frontend, dùng để dựng link xác thực trong email. Sai giá trị này nghĩa
  # là mọi email OTP đều chứa link chết — không có lỗi nào báo ra, chỉ có người dùng không
  # xác thực được tài khoản.
  APP_FRONTEND_BASE_URL: "https://novaplay.vn"
