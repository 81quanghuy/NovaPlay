# MẪU — KHÔNG commit giá trị thật.
#
# Tạo secret thật bằng lệnh (hoặc bằng công cụ quản lý secret của bạn):
#
#   kubectl create secret generic api-gateway-secrets \
#     --from-literal=GATEWAY_SHARED_SECRET='...' \
#     --from-literal=REDIS_PASSWORD='...'
#
# Lưu ý:
# - GATEWAY_SHARED_SECRET phải TRÙNG KHỚP với giá trị cấu hình ở auth-service, user-service,
#   movie-service, notification-service. Lệch giá trị sẽ khiến MỌI request downstream bị trả
#   403, kể cả request duyệt catalog công khai — gateway gắn header này cho cả traffic ẩn danh,
#   vì nó chứng minh "đã đi qua gateway" chứ không phải "đã đăng nhập". Mọi service phải được
#   cập nhật cùng lúc.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  labels:
    app: api-gateway
type: Opaque
stringData:
  GATEWAY_SHARED_SECRET: ""
  REDIS_HOST: ""
  REDIS_PORT: ""
  REDIS_PASSWORD: ""
  REDIS_SSL_ENABLED: ""
---
# MẪU thứ hai — public key verify JWT. CHỈ public key: gateway không bao giờ được chạm tới
# private key, việc ký hoàn toàn thuộc về auth-service.
#
# Giá trị phải là ĐÚNG public.pem trong auth-service-jwt-keys. Lệch một ký tự là mọi request
# đã đăng nhập trả 401 — và triệu chứng rất giống token hết hạn nên dễ chẩn đoán nhầm.
#
# Dev: apply-dev-secrets.sh tự tạo từ api-gateway/src/main/resources/certs/public.pem.
# Prod: sinh bằng kubeseal rồi commit SealedSecret.
#
#   kubectl create secret generic api-gateway-jwt-public-key --from-file=public.pem=public.pem
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-jwt-public-key
  labels:
    app: api-gateway
type: Opaque
stringData:
  public.pem: ""
