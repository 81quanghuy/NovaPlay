apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8072"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Cho phép request đang chạy hoàn tất; khớp với server.shutdown=graceful và
      # spring.lifecycle.timeout-per-shutdown-phase=30s.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Xem chú thích cùng chỗ ở auth-service: file trong volume Secret thuộc root:root, tiến
        # trình chạy uid 1000 sẽ bị "Permission denied" nếu không có fsGroup.
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: ghcr.io/81nhuquynh/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8072
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # MDC traceId/spanId trong log chỉ có giá trị khi javaagent được gắn.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/libs/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            # Public key verify JWT đến từ Secret mount ở dưới, KHÔNG từ classpath trong image.
            # Thiếu biến này, JwtConfig rơi về classpath:certs/public.pem — thứ .dockerignore đã
            # chặn khỏi image, nên bean publicKey() ném FileNotFoundException lúc khởi động.
            - name: JWT_PUBLIC_KEY_LOCATION
              value: file:/etc/novaplay/keys/public.pem
            # Gửi trace về Alloy (namespace monitoring), KHÔNG gửi thẳng Tempo nữa: Alloy là
            # điểm nhận OTLP duy nhất ở cả hai chế độ monitoring và tự forward tiếp về Tempo
            # trong cụm hoặc lên Grafana Cloud. Vẫn tắt OTLP metrics/logs — metrics do Alloy
            # scrape /actuator/prometheus, logs do Alloy đọc stdout của pod. Nếu CHƯA deploy
            # monitoring, đổi endpoint hoặc đặt OTEL_SDK_DISABLED=true.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc:4318
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Startup probe cho JVM thời gian khởi động mà không phải nới lỏng liveness.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-public-key
              mountPath: /etc/novaplay/keys
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # PHẢI khớp auth-service/.../keys/public.pem — lệch key thì mọi request đã đăng nhập trả
        # 401, triệu chứng giống hệt token hết hạn nên rất dễ chẩn đoán nhầm.
        - name: jwt-public-key
          secret:
            secretName: api-gateway-jwt-public-key
            defaultMode: 0440
