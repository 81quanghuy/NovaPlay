apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8072"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Cho phép request đang chạy hoàn tất; khớp với server.shutdown=graceful và
      # spring.lifecycle.timeout-per-shutdown-phase=30s.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api-gateway
          image: ghcr.io/81nhuquynh/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8072
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # MDC traceId/spanId trong log chỉ có giá trị khi javaagent được gắn.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/libs/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            # Gửi trace về Tempo (namespace monitoring). Tempo CHỈ nhận traces nên tắt
            # OTLP metrics/logs — metrics do Prometheus scrape /actuator/prometheus, logs do
            # Alloy→Loki. Nếu CHƯA deploy monitoring, đổi endpoint hoặc đặt OTEL_SDK_DISABLED=true.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc:4318
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Public key verify JWT đến từ Secret mount ở dưới, KHÔNG từ classpath trong image.
            # Phải là ĐÚNG public key khớp private key mà auth-service đang ký — lệch một ký tự
            # là toàn bộ request đã đăng nhập trả 401.
            - name: JWT_PUBLIC_KEY_LOCATION
              value: file:/etc/novaplay/keys/public.pem
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          # Startup probe cho JVM thời gian khởi động mà không phải nới lỏng liveness.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-public-key
              mountPath: /etc/novaplay/keys
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # CHỈ public key. Gateway không bao giờ được chạm tới private key — nó chỉ verify chữ ký,
        # việc ký hoàn toàn thuộc về auth-service.
        - name: jwt-public-key
          secret:
            secretName: api-gateway-jwt-public-key
            defaultMode: 0400
