apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  # LoadBalancer: đây là điểm vào duy nhất từ bên ngoài cluster, khác mọi service khác
  # (ClusterIP) vốn chỉ được tiếp cận qua chính gateway này.
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
