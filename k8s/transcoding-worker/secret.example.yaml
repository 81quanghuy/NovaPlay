# MẪU — KHÔNG commit giá trị thật.
#
#   kubectl create secret generic transcoding-worker-secrets \
#     --from-literal=KAFKA_BOOTSTRAP_SERVERS='kafka-0:9092,kafka-1:9092,kafka-2:9092' \
#     --from-literal=MEDIA_SERVICE_URI='http://media-service:8081' \
#     --from-literal=GATEWAY_SHARED_SECRET='...' \
#     --from-literal=TRANSCODE_KEY_WRAP_SECRET='<base64, 32 byte ngẫu nhiên>'
#
# Lưu ý:
# - TRANSCODE_KEY_WRAP_SECRET phải TRÙNG KHỚP với streaming-service's secret cùng tên.
# - KHÔNG có access key/secret key AWS ở đây: production dùng IRSA, xem media-service's
#   secret.example.yaml — worker tải/ghi object bằng credentials thật, không phải presigned URL.
apiVersion: v1
kind: Secret
metadata:
  name: transcoding-worker-secrets
  labels:
    app: transcoding-worker
type: Opaque
stringData:
  KAFKA_BOOTSTRAP_SERVERS: ""
  MEDIA_SERVICE_URI: ""
  GATEWAY_SHARED_SECRET: ""
  TRANSCODE_KEY_WRAP_SECRET: ""
